<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lah We">
<meta name="theme-color" content="#f5f1ec">
<title>Lah We</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f5f1ec;--bg2:#ede8e1;--card:#fff;--border:#e2dbd2;
  --navy:#1e3558;--ndim:rgba(30,53,88,.07);
  --gold:#b87c2a;--gdim:rgba(184,124,42,.1);
  --green:#2d7a52;--grdim:rgba(45,122,82,.08);
  --red:#b83c3c;--rdim:rgba(184,60,60,.08);
  --blue:#2a6fc4;--bdim:rgba(42,111,196,.08);
  --text:#1a1816;--muted:#8a8070;--muted2:#c4bdb2;
  --nh:60px;--sb:env(safe-area-inset-bottom,0px);--r:12px;
}
[data-dark="true"]{
  --bg:#111010;--bg2:#1c1b1a;--card:#1e1d1c;--border:#2e2c2a;
  --ndim:rgba(30,53,88,.3);--gdim:rgba(184,124,42,.2);
  --grdim:rgba(45,122,82,.18);--rdim:rgba(184,60,60,.18);--bdim:rgba(42,111,196,.2);
  --text:#f0ede8;--muted:#7a7468;--muted2:#3a3830;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;overflow:hidden;transition:background .2s,color .2s}
#app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;position:relative;overflow:hidden}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nh) + var(--sb) + 16px)}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--border);display:flex;align-items:flex-start;padding-top:9px;padding-bottom:var(--sb);z-index:100;height:calc(var(--nh) + var(--sb))}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--muted2);cursor:pointer;padding:2px 0;transition:color .12s}
.nb.on{color:var(--navy)}.nb svg{width:20px;height:20px}
.nb span{font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
#rest-float{position:fixed;bottom:calc(var(--nh) + var(--sb) + 12px);right:14px;z-index:150;display:none;cursor:pointer}
#rest-float.on{display:block}
#rest-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-52%);text-align:center;pointer-events:none}
#rest-time{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500;color:var(--navy);display:block;line-height:1}
#rest-word{font-size:8px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:1px;display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin:0 13px 10px;overflow:hidden}
.ch{padding:11px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.ct{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.cb{padding:13px}
.dash-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin:0 13px 10px;overflow:hidden}
.dash-hdr{display:flex;align-items:center;gap:10px;padding:13px;cursor:pointer;user-select:none;transition:background .1s}
.dash-hdr:active{background:var(--bg)}
.dash-icon{font-size:17px;flex-shrink:0;width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:var(--bg2);border-radius:8px}
.dash-info{flex:1;min-width:0}
.dash-title{font-size:14px;font-weight:600}
.dash-sub{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.dash-chev{color:var(--muted2);font-size:18px;transition:transform .2s;line-height:1}
.dash-chev.open{transform:rotate(90deg)}
.dash-body{border-top:1px solid var(--border)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:8px;border:none;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .1s;user-select:none}
.btn:active{opacity:.8;transform:scale(.97)}
.btp{background:var(--navy);color:#fff}.bts{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btg{background:transparent;color:var(--muted)}.btd{background:var(--red);color:#fff}
.btok{background:var(--green);color:#fff}.btb{background:var(--bdim);color:var(--blue);border:1px solid rgba(42,111,196,.2)}
.bfw{width:100%}.bsm{padding:7px 12px;font-size:13px}.bxs{padding:4px 8px;font-size:11px}
.delbtn{background:transparent;border:1px solid var(--border);color:var(--red)}.delbtn:active{background:var(--rdim)}
input,select,textarea{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;padding:9px 11px;width:100%;outline:none;transition:border-color .12s;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--navy);background:var(--card)}
input[type=number]{font-family:'IBM Plex Mono',monospace;text-align:center;font-size:16px}
input[type=date]{font-family:'DM Sans',sans-serif;font-size:14px}
select option{background:var(--card)}
textarea{resize:none;line-height:1.5}
input[type=range]{background:none;border:none;padding:0;accent-color:var(--navy)}
.ov{position:fixed;inset:0;background:rgba(10,8,5,.55);z-index:200;display:flex;align-items:flex-end}
.modal{background:var(--card);border-top:1px solid var(--border);border-radius:18px 18px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding:14px 14px calc(16px + var(--sb));animation:su .2s ease;-webkit-overflow-scrolling:touch}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mh{width:32px;height:3px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.mt{font-size:18px;font-weight:600;margin-bottom:14px}
.page-title{font-size:20px;font-weight:600}
.sec-lbl{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:12px 13px 6px}
.mono{font-family:'IBM Plex Mono',monospace}
.ph{padding:14px 13px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.fbar{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--border);padding:9px 13px;display:flex;align-items:center;gap:9px}
.fbar-name{flex:1;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--navy);background:var(--ndim);padding:3px 7px;border-radius:5px}
.exb{margin:0 13px 10px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.exbh{padding:10px 13px;background:var(--bg);border-bottom:1px solid var(--border)}
.exbn{font-size:14px;font-weight:600}
.exbc{font-size:11px;color:var(--muted);margin-top:1px}
.ex-last{font-size:11px;color:var(--green);font-weight:500;margin-top:2px}
.slbls{display:grid;grid-template-columns:22px 1fr 1fr 50px 30px 22px;gap:4px;padding:4px 10px;background:var(--bg)}
.sl{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted2);text-align:center}
.srow{display:grid;grid-template-columns:22px 1fr 1fr 50px 30px 22px;gap:4px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--border)}
.srow:last-child{border-bottom:none}
.srow.done{background:rgba(45,122,82,.05)}
.snum{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted2);text-align:center}
.sinp{padding:6px 3px;font-size:15px;border-radius:7px}
.sinp:disabled{background:transparent;border-color:transparent;color:var(--text)}
.e1rm-cell{display:flex;align-items:center;justify-content:center}
.e1rm-badge{font-family:'IBM Plex Mono',monospace;font-size:9px;padding:2px 4px;border-radius:4px;background:var(--bg2);color:var(--muted);border:1px solid var(--border);text-align:center;white-space:nowrap}
.e1rm-badge.pr{color:var(--gold);border-color:rgba(184,124,42,.3);background:var(--gdim)}
.chk{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s;color:transparent;font-size:13px;flex-shrink:0}
.chk.done{background:var(--green);border-color:var(--green);color:#fff}
.tag-btn{width:20px;height:28px;border-radius:5px;border:1px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted2);flex-shrink:0;transition:all .1s}
.tag-btn.tagged{border-color:var(--gold);color:var(--gold)}
.tag-row{display:flex;gap:5px;padding:5px 10px 7px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.tag-chip{padding:3px 9px;border-radius:10px;border:1px solid var(--border);background:var(--bg);font-size:11px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .1s}
.tag-chip.on{border-color:var(--navy);background:var(--ndim);color:var(--navy)}
.tag-chip.pain{border-color:var(--red);background:var(--rdim);color:var(--red)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}
.sc{background:var(--card);padding:11px 13px}
.sv{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:500}
.slb{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.hi{display:flex;align-items:center;padding:12px 13px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.hi:active{background:var(--bg)}
.hn{font-size:14px;font-weight:600}
.hm{font-size:11px;color:var(--muted);margin-top:2px}
.sui{display:flex;align-items:center;padding:11px 13px;border-bottom:1px solid var(--border)}
.tog{width:46px;height:26px;border-radius:13px;border:1px solid var(--border);background:transparent;cursor:pointer;position:relative;transition:all .18s;flex-shrink:0}
.tog::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:var(--muted2);top:3px;left:3px;transition:all .18s}
.tog.on{border-color:var(--green);background:rgba(45,122,82,.15)}
.tog.on::after{background:var(--green);transform:translateX(20px)}
.exi{display:flex;align-items:center;padding:11px 13px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.exi:active{background:var(--bg)}
.exin{font-size:14px;font-weight:500;flex:1}
.badge{font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px}
.bg{background:var(--gdim);color:var(--gold)}
.ba{background:var(--ndim);color:var(--navy)}
.sw{padding:9px 13px;border-bottom:1px solid var(--border)}
.fr{display:flex;gap:6px;padding:7px 13px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border)}
.fr::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:4px 11px;border-radius:16px;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;transition:all .1s}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.ptabs{display:flex;border-bottom:1px solid var(--border);padding:0 13px;overflow-x:auto;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptab{flex-shrink:0;padding:10px 12px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;transition:all .1s;background:none;border-top:none;border-left:none;border-right:none;margin-bottom:-1px}
.ptab.on{color:var(--navy);border-bottom-color:var(--navy)}
.mvrow{display:flex;align-items:center;padding:9px 13px;border-bottom:1px solid var(--border)}
.mvrow:last-child{border-bottom:none}
.mvname{flex:1;font-size:12px;font-weight:500}
.mvbar-wrap{width:60px;height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin:0 8px}
.mvbar{height:100%;border-radius:3px}
.mvsts{font-size:10px;font-weight:600;min-width:60px;text-align:right}
.aft-total{background:var(--navy);color:#fff;margin:0 13px 10px;border-radius:var(--r);padding:14px}
.aft-score-num{font-family:'IBM Plex Mono',monospace;font-size:40px;font-weight:500;line-height:1}
.aft-row{padding:10px 13px;border-bottom:1px solid var(--border)}
.aft-row:last-child{border-bottom:none}
.aft-bar-track{height:6px;background:var(--bg2);border-radius:3px;margin:6px 0 3px;position:relative}
.aft-bar-fill{height:100%;border-radius:3px;transition:width .35s ease}
.aft-bar-goal{position:absolute;top:-4px;width:2px;height:14px;background:var(--navy);border-radius:1px;opacity:.5}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border)}
.cal-day-hdr{background:var(--bg);padding:6px 0;text-align:center;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cal-cell{background:var(--card);padding:6px 4px;min-height:50px;cursor:pointer;transition:background .1s}
.cal-cell:active{background:var(--bg)}
.cal-cell.empty{background:var(--bg);cursor:default}
.cal-cell.today .cal-date{background:var(--navy);color:#fff;border-radius:50%}
.cal-date{width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;margin:0 auto 3px}
.cal-dots{display:flex;justify-content:center;gap:2px;flex-wrap:wrap}
.cal-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.fg{margin-bottom:12px}
.fl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;display:block}
.frow{display:flex;align-items:center;gap:8px}
.ib{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:14px;transition:all .1s}
.ib:active{background:var(--bg)}
.empty{text-align:center;padding:48px 24px;color:var(--muted)}
.etit{font-size:16px;font-weight:600;color:var(--text);margin-bottom:5px}
.chart-wrap{padding:12px;position:relative;height:200px}
.toast{position:fixed;top:22px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;z-index:999;animation:tin .18s ease,tout .2s ease 2s both;white-space:nowrap;color:var(--text)}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(-7px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes tout{to{opacity:0}}
.wsr{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.wsr:last-child{border-bottom:none}
.afill-tag{font-size:9px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--green);background:var(--grdim);border-radius:3px;padding:1px 5px;margin-left:5px}
.timer-display{font-family:'IBM Plex Mono',monospace;font-size:56px;font-weight:500;text-align:center;margin:18px 0;color:var(--text)}
.diff-add{color:var(--green);font-size:12px;font-weight:500}
.insight{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid var(--border);cursor:pointer}
.insight:last-child{border-bottom:none}
.insight:active{background:var(--bg)}
.insight-icon{font-size:18px;flex-shrink:0;width:28px;text-align:center}
.insight-text{flex:1;font-size:13px;font-weight:500}
.insight-sub{font-size:11px;color:var(--muted);margin-top:1px}
.act-icon{width:32px;height:32px;border-radius:8px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;margin-right:10px}
.goal-card{border:2px solid var(--border);border-radius:10px;padding:13px;cursor:pointer;transition:all .15s;background:var(--card);text-align:left}
.goal-card.on{border-color:var(--navy);background:var(--ndim)}
.goal-card-icon{font-size:22px;margin-bottom:5px}
.goal-card-title{font-size:13px;font-weight:600}
.goal-card-sub{font-size:10px;color:var(--muted);margin-top:2px}
.qs-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 13px 12px}
.qs-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 13px}
.qs-val{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:500}
.qs-lbl{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.qs-sub{font-size:10px;color:var(--green);margin-top:2px;font-weight:500}
.meas-row{display:flex;align-items:center;padding:9px 13px;border-bottom:1px solid var(--border)}
.meas-row:last-child{border-bottom:none}
.meas-lbl{flex:1;font-size:13px;font-weight:500}
.meas-val{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--navy)}
.meas-chg{font-size:10px;font-weight:600;margin-left:6px}
.pain-banner{margin:0 13px 10px;padding:10px 13px;background:var(--rdim);border:1px solid rgba(184,60,60,.25);border-radius:10px;font-size:12px;color:var(--red);font-weight:600}
.plate-visual{display:flex;flex-wrap:wrap;gap:5px;padding:12px;background:var(--bg);border-radius:8px;margin-bottom:10px;align-items:center;justify-content:center;min-height:52px}
.plate{display:inline-flex;align-items:center;justify-content:center;border-radius:5px;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:11px;padding:6px 9px;border:2px solid}
.p45{background:#1e3558;color:#fff;border-color:#1e3558}
.p35{background:#b87c2a;color:#fff;border-color:#b87c2a}
.p25{background:#2d7a52;color:#fff;border-color:#2d7a52}
.p10{background:#2a6fc4;color:#fff;border-color:#2a6fc4}
.p5{background:#b83c3c;color:#fff;border-color:#b83c3c}
.p2{background:var(--bg2);color:var(--text);border-color:var(--border)}
</style>
</head>
<body>
<div id="app">
  <div id="rest-float" onclick="skipRest()">
    <svg width="66" height="66" viewBox="0 0 66 66">
      <circle cx="33" cy="33" r="28" fill="var(--card)" stroke="var(--border)" stroke-width="2.5"/>
      <circle id="rc" cx="33" cy="33" r="28" fill="none" stroke="var(--navy)" stroke-width="2.5"
        stroke-linecap="round" stroke-dasharray="176" stroke-dashoffset="176"
        transform="rotate(-90 33 33)" style="transition:stroke-dashoffset 1s linear"/>
    </svg>
    <div id="rest-label"><span id="rest-time">1:30</span><span id="rest-word">REST</span></div>
  </div>
  <div id="content"></div>
  <nav id="nav">
    <button class="nb on" onclick="go('workout')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4v6a6 6 0 0 0 12 0V4"/><line x1="6" y1="20" x2="18" y2="20"/><line x1="4" y1="6" x2="6" y2="6"/><line x1="18" y1="6" x2="20" y2="6"/><line x1="4" y1="8" x2="6" y2="8"/><line x1="18" y1="8" x2="20" y2="8"/></svg>
      <span>Workout</span>
    </button>
    <button class="nb" onclick="go('history')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>History</span>
    </button>
    <button class="nb" onclick="go('progress')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <span>Progress</span>
    </button>
    <button class="nb" onclick="go('supps')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
      <span>Supps</span>

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function today(){return new Date().toISOString().split('T')[0];}
function fmtDate(iso){if(!iso)return'';return new Date(iso).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});}
function fmtShort(iso){if(!iso)return'';return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function fmtDur(ms){const m=Math.floor(ms/60000),h=Math.floor(m/60);return h>0?`${h}h ${m%60}m`:`${m}m`;}
function fmtTimer(s){const m=Math.floor(s/60),sec=s%60;return`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;}
function e1rm(w,r){return r===1?w:Math.round(w*(1+r/30));}
function allEx(){return[...EXERCISES,...(S.custom||[])];}
function getEx(id){return allEx().find(e=>e.id===id);}
function totalVol(wk){return wk.exercises.reduce((t,ex)=>t+ex.sets.filter(s=>s.done).reduce((a,s)=>a+(parseFloat(s.w||0)*parseInt(s.r||0)),0),0);}
function doneSetCnt(wk){return wk.exercises.reduce((t,ex)=>t+ex.sets.filter(s=>s.done).length,0);}
function bwKg(){return(S.bodyweight||185)/2.205;}
function sessionCals(ms){return Math.round(4.5*bwKg()*(ms/3600000));}
function activityCals(act){
  const t=ACT_TYPES.find(a=>a.id===act.type)||{mets:5};
  const durHrs=(parseFloat(act.dur)||0)/60;
  if(act.type==='ruck'){const tf={flat:1,hilly:1.3,trail:1.2,mixed:1.15}[act.terrain||'flat'];return Math.round(0.30*((S.bodyweight||185)+(parseFloat(act.ruckWeight)||0))*(parseFloat(act.dist)||0)*tf);}
  return Math.round(t.mets*bwKg()*durHrs);
}
function greet(){const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening';}
function cv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function sparkline(data,color,w=60,h=24){
  const v=data.filter(x=>x!=null&&!isNaN(x));if(v.length<2)return'';
  const mn=Math.min(...v),mx=Math.max(...v),rng=mx-mn||1;
  const pts=v.map((x,i)=>`${((i/(v.length-1))*w).toFixed(1)},${(h-((x-mn)/rng)*(h-4)-2).toFixed(1)}`).join(' ');
  return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;flex-shrink:0"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function getStreak(){
  const d=new Set([...S.workouts.map(w=>new Date(w.started).toISOString().split('T')[0]),...S.activities.map(a=>a.date)]);
  let n=0;const dt=new Date();
  while(true){const ds=dt.toISOString().split('T')[0];if(!d.has(ds))break;n++;dt.setDate(dt.getDate()-1);}
  return n;
}
function getWeeklyActivity(nw=12){
  return Array.from({length:nw},(_, i)=>{
    const end=new Date();end.setDate(end.getDate()-(nw-1-i)*7);
    const start=new Date(end);start.setDate(start.getDate()-7);
    return S.workouts.filter(w=>w.started>=start.getTime()&&w.started<end.getTime()).length+
      S.activities.filter(a=>{const t=new Date(a.date+'T12:00:00').getTime();return t>=start.getTime()&&t<end.getTime();}).length;
  });
}
function getExStrData(exId){
  const r=[];
  S.workouts.slice().reverse().forEach(wk=>{
    const ex=wk.exercises.find(e=>e.exId===exId);if(!ex)return;
    const done=ex.sets.filter(s=>s.done&&parseFloat(s.w)>0);if(!done.length)return;
    const mw=Math.max(...done.map(s=>parseFloat(s.w)));
    r.push({label:fmtShort(new Date(wk.started).toISOString()),maxW:mw,vol:done.reduce((t,s)=>t+(parseFloat(s.w)*parseInt(s.r||0)),0),e1rm:e1rm(mw,done.find(s=>parseFloat(s.w)===mw)?.r||1)});
  });
  return r;
}
function getExsWithHist(){const ids=new Set();S.workouts.forEach(wk=>wk.exercises.forEach(ex=>{if(ex.sets.some(s=>s.done&&parseFloat(s.w)>0))ids.add(ex.exId);}));return[...ids];}
function getPainWarnings(){
  const w=[];
  const ids=new Set(S.workouts.slice(0,10).flatMap(wk=>wk.exercises.map(e=>e.exId)));
  ids.forEach(exId=>{
    const cnt=S.workouts.filter(wk=>wk.exercises.some(e=>e.exId===exId)).slice(0,3)
      .filter(wk=>wk.exercises.find(e=>e.exId===exId)?.sets.some(s=>s.done&&s.tag==='Pain')).length;
    if(cnt>=2)w.push({exId,name:getEx(exId)?.name||exId});
  });
  return w;
}
function getRecoveryData(){
  const ago3=Date.now()-21*86400000;
  const bkts=[[Date.now()-7*86400000,Date.now()],[Date.now()-14*86400000,Date.now()-7*86400000],[Date.now()-21*86400000,Date.now()-14*86400000]];
  const ws=bkts.map(()=>{const m={};Object.keys(MEV_MAV).forEach(k=>m[k]=0);return m;});
  S.workouts.filter(w=>w.started>=ago3).forEach(wk=>{
    const bi=bkts.findIndex(([s,e])=>wk.started>=s&&wk.started<e);if(bi<0)return;
    wk.exercises.forEach(ex=>{const info=getEx(ex.exId);if(!info?.muscle)return;const d=ex.sets.filter(s=>s.done).length;ws[bi][info.muscle]=(ws[bi][info.muscle]||0)+d;});
  });
  const warnings=[];
  Object.entries(MEV_MAV).forEach(([m,mm])=>{if(ws.filter(w=>(w[m]||0)>mm.mav).length>=2)warnings.push({muscle:mm.lbl});});
  return{ws,warnings};
}
function getWilksData(){
  const pr=S.prs;
  const sq=pr['squat']||pr['front-squat']||pr['hex-dl'];
  const bench=pr['bb-bench']||pr['inc-bench']||pr['db-bench'];
  const dl=pr['deadlift']||pr['sumo-dl'];
  if(!sq||!bench||!dl)return null;
  const total=parseFloat(sq.w)+parseFloat(bench.w)+parseFloat(dl.w);
  const bw=S.bodyweight||185;const gn=S.aftGender||'male';
  const bwK=bw/2.205,totK=total/2.205;
  const aw=gn==='female'?[594.31747775582,-27.23842536447,0.82112226871,-0.00930733913,4.731582e-5,-9.054e-8]:[-216.0475144,16.2606339,-0.002388645,-0.00113732,7.01863e-6,-1.291e-8];
  const dw=aw[0]+aw[1]*bwK+aw[2]*bwK**2+aw[3]*bwK**3+aw[4]*bwK**4+aw[5]*bwK**5;
  const wilks=Math.round(500/dw*totK*10)/10;
  let dd;
  if(gn==='female'){dd=-57.96288+13.6175032*bwK-0.1126655495*bwK**2+0.0005158568*bwK**3-1.0706e-6*bwK**4;}
  else{dd=-307.75076+24.0900756*bwK-0.1918759221*bwK**2+0.0007391293*bwK**3-1.093e-6*bwK**4;}
  const dots=Math.round(500/dd*totK*10)/10;
  return{total,wilks,dots,sq:sq.w,bench:bench.w,dl:dl.w};
}
function getStdLevels(){
  const bw=S.bodyweight||185;const gn=S.aftGender||'male';
  return Object.entries(STR_STANDARDS).map(([id,std])=>{
    const pr=S.prs[id];if(!pr)return{id,name:std.name,level:0,current:0,targets:[]};
    const w=parseFloat(pr.w);
    const mults=(gn==='female'?std.f:std.m).map(m=>m*bw);
    let level=0;for(let i=0;i<mults.length;i++){if(w>=mults[i])level=i+1;}
    return{id,name:std.name,level,current:w,targets:mults};
  });
}

// AFT scoring
function aftScore(evId,val,ag,gn){
  const g=AFT_TABLES[gn]||AFT_TABLES.male;const agKey=g[ag]?ag:Object.keys(g)[0];
  const table=g[agKey]?.[evId];if(!table||val===''||val==null)return null;
  const v=parseFloat(val);if(isNaN(v))return null;
  const ev=AFT_EVENTS.find(e=>e.id===evId);const dir=ev?.dir||'high';
  const sorted=[...table].sort((a,b)=>dir==='high'?a[0]-b[0]:b[0]-a[0]);
  if(dir==='high'){if(v<=sorted[0][0])return Math.max(0,sorted[0][1]-5);if(v>=sorted[sorted.length-1][0])return 100;for(let i=1;i<sorted.length;i++){if(v<=sorted[i][0]){const p=(v-sorted[i-1][0])/(sorted[i][0]-sorted[i-1][0]);return Math.round(sorted[i-1][1]+p*(sorted[i][1]-sorted[i-1][1]));}}
  }else{if(v>=sorted[0][0])return Math.max(0,sorted[0][1]-5);if(v<=sorted[sorted.length-1][0])return 100;for(let i=1;i<sorted.length;i++){if(v>=sorted[i][0]){const p=(sorted[i-1][0]-v)/(sorted[i-1][0]-sorted[i][0]);return Math.round(sorted[i-1][1]+p*(sorted[i][1]-sorted[i-1][1]));}}
  }
  return 60;
}

function getInsights(){
  const ins=[];const td=today();const goal=S.goal||'general';
  // Pain first — highest priority
  const pw=getPainWarnings();
  if(pw.length)ins.push({icon:'🩹',text:`Pain flag: ${pw[0].name}`,sub:'Logged pain in recent sessions — consider rest',action:()=>go('progress'),p:0});
  // Supplement adherence
  if(S.supps.length){const logs=S.suppLogs[td]||{};const miss=S.supps.filter(s=>!logs[s.id]);if(miss.length)ins.push({icon:'💊',text:`${miss.length} supp${miss.length>1?'s':''} not taken today`,sub:miss.slice(0,2).map(s=>s.name).join(', ')+(miss.length>2?'…':''),action:()=>go('supps'),p:1});}
  // Volume
  const ago=Date.now()-7*86400000;const sbm={};
  S.workouts.filter(w=>w.started>=ago).forEach(wk=>wk.exercises.forEach(ex=>{const info=getEx(ex.exId);if(!info?.muscle)return;sbm[info.muscle]=(sbm[info.muscle]||0)+ex.sets.filter(s=>s.done).length;}));
  const neg=Object.entries(MEV_MAV).filter(([m,mm])=>(sbm[m]||0)<mm.mev&&(sbm[m]||0)>0);
  if(neg.length)ins.push({icon:'⚠️',text:`${neg[0][1].lbl} below MEV this week`,sub:`${sbm[neg[0][0]]||0} sets · need ${neg[0][1].mev}`,action:()=>go('progress'),p:2});
  // Last workout
  if(S.workouts.length){const days=Math.floor((Date.now()-S.workouts[0].started)/86400000);if(days>=3)ins.push({icon:'⏳',text:`${days} days since last workout`,sub:`Last: ${S.workouts[0].name}`,action:()=>startWorkout(),p:3});}
  else ins.push({icon:'🏋️',text:'No workouts logged yet',sub:'Tap to start your first session',action:()=>startWorkout(),p:4});
  // Steps (weight loss goal)
  if(goal==='weightloss'){const steps=S.stepsLog[td]||0;if(steps<7000)ins.push({icon:'🚶',text:`${steps.toLocaleString()} steps today`,sub:'Goal: 10,000 steps',action:()=>showRetroSteps(),p:2});}

function getLastRSess(rid){return S.workouts.find(w=>w.routineId===rid);}
function getAutoFill(exId,rid){
  if(rid){const sess=getLastRSess(rid);if(sess){const ex=sess.exercises.find(e=>e.exId===exId);if(ex){const done=ex.sets.filter(s=>s.done);if(done.length)return done.map(s=>({w:s.w,r:s.r}));}}}
  const pr=S.prs[exId];if(pr)return[{w:pr.w,r:pr.r},{w:pr.w,r:pr.r},{w:pr.w,r:pr.r}];return null;
}
function getLastStr(exId,rid){
  if(!rid)return null;const sess=getLastRSess(rid);if(!sess)return null;
  const ex=sess.exercises.find(e=>e.exId===exId);if(!ex)return null;
  const done=ex.sets.filter(s=>s.done);if(!done.length)return null;
  const mw=Math.max(...done.map(s=>parseFloat(s.w||0)));const ms=done.find(s=>parseFloat(s.w)===mw);
  return`Last: ${ms?.w||'?'} ${S.unit} × ${ms?.r||'?'} · ${done.length} sets`;
}
function startWorkout(rid){
  S.activeWorkout={id:uid(),routineId:rid||null,name:rid?(S.routines.find(r=>r.id===rid)?.name||'Workout'):`Workout — ${new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}`,started:Date.now(),exercises:[],notes:'',_origExIds:null};
  if(rid){const r=S.routines.find(x=>x.id===rid);if(r){S.activeWorkout._origExIds=r.exercises.map(e=>e.exId);r.exercises.forEach(re=>{const fill=getAutoFill(re.exId,rid);const sets=fill?fill.map(f=>({w:f.w,r:f.r,done:false,tag:''})):Array.from({length:re.sets||3},()=>({w:re.w||'',r:re.r||'',done:false,tag:''}));S.activeWorkout.exercises.push({exId:re.exId,sets,_af:!!fill});});}}
  save();render();startWtTimer();
}

    ex.sets.forEach((s,si)=>{

function upd(ei,si,f,v){if(!S.activeWorkout)return;S.activeWorkout.exercises[ei].sets[si][f]=v;save();}
function togSet(ei,si){
  if(!S.activeWorkout)return;
  const s=S.activeWorkout.exercises[ei].sets[si];
  const wi=document.querySelector(`#sr-${ei}-${si} input:nth-of-type(1)`);
  const ri=document.querySelector(`#sr-${ei}-${si} input:nth-of-type(2)`);
  if(wi)s.w=wi.value;if(ri)s.r=ri.value;
  s.done=!s.done;
  if(s.done){checkPR(S.activeWorkout.exercises[ei].exId,parseFloat(s.w||0),parseInt(s.r||0));startRest(S.restDur);}
  save();
  const row=document.getElementById(`sr-${ei}-${si}`);
  if(row){
    row.className=`srow${s.done?' done':''}`;
    const chk=row.querySelector('.chk');if(chk)chk.className=`chk${s.done?' done':''}`;
    row.querySelectorAll('input').forEach(inp=>inp.disabled=s.done);
    const est=s.done&&parseFloat(s.w)&&parseInt(s.r)?e1rm(parseFloat(s.w),parseInt(s.r)):null;
    const pr=S.prs[S.activeWorkout.exercises[ei].exId];
    const isPR=est&&pr&&est>=(pr.est||0);
    const cell=row.querySelector('.e1rm-cell');
    if(cell)cell.innerHTML=est?`<div class="e1rm-badge${isPR?' pr':''}">${est}${isPR?'🏆':''}</div>`:'';
  }
}
function toggleTagRow(ei,si){if(!S.activeWorkout)return;S.activeWorkout.exercises[ei].sets[si]._showTag=!S.activeWorkout.exercises[ei].sets[si]._showTag;renderSession(document.getElementById('content'));}
function setTag(ei,si,tag){if(!S.activeWorkout)return;const s=S.activeWorkout.exercises[ei].sets[si];s.tag=tag;s._showTag=false;save();renderSession(document.getElementById('content'));}
function checkPR(exId,w,r){if(!w||!r)return;const est=e1rm(w,r);const prev=S.prs[exId];if(!prev||est>e1rm(parseFloat(prev.w),parseInt(prev.r))){S.prs[exId]={w,r,est,date:today()};save();const ex=getEx(exId);toast(`🏆 New PR — ${ex?.name||'Exercise'}: ${w}${S.unit}×${r}`,'gold');}}
function addSet(ei){if(!S.activeWorkout)return;const ex=S.activeWorkout.exercises[ei];const last=ex.sets[ex.sets.length-1];ex.sets.push({w:last?.w||'',r:last?.r||'',done:false,tag:''});save();renderSession(document.getElementById('content'));setTimeout(()=>{const rows=document.querySelectorAll(`#exb-${ei} .srow`);if(rows.length)rows[rows.length-1].scrollIntoView({behavior:'smooth',block:'nearest'});},60);}
function rmLastSet(ei){if(!S.activeWorkout)return;const ex=S.activeWorkout.exercises[ei];if(ex.sets.length>1){ex.sets.pop();save();renderSession(document.getElementById('content'));}}
function removeEx(ei){if(!S.activeWorkout)return;S.activeWorkout.exercises.splice(ei,1);save();renderSession(document.getElementById('content'));}
function confirmCancel(){customConfirm('This workout will not be saved.','Discard workout',()=>{S.activeWorkout=null;if(wtInt)clearInterval(wtInt);skipRest();save();render();});}

function showPlateCalc(ei){
  const ex=S.activeWorkout?.exercises[ei];
  const lastW=ex?.sets.filter(s=>s.done).slice(-1)[0]?.w||ex?.sets[0]?.w||'';
  const ov=makeOv('plate-ov');
  ov.innerHTML=`<div class="modal"><div class="mh"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div class="mt" style="margin-bottom:0">Plate Calculator</div>
      <button class="btn btg bxs" onclick="document.getElementById('plate-ov').remove()">✕ Close</button>
    </div>
    <div class="fg"><label class="fl">Target Weight (${S.unit})</label>
      <input type="number" inputmode="decimal" id="plt-tgt" value="${lastW}" placeholder="0" oninput="calcPltDisp()"></div>
    <div class="fg"><label class="fl">Bar Weight</label>
      <select id="plt-bar" onchange="calcPltDisp()">
        <option value="${S.unit==='kg'?20:45}">${S.unit==='kg'?'20 kg':'45 lbs'} (Standard)</option>
        <option value="${S.unit==='kg'?15:35}">${S.unit==='kg'?'15 kg':'35 lbs'} (Light)</option>
        <option value="${S.unit==='kg'?10:25}">${S.unit==='kg'?'10 kg':'25 lbs'} (Women's)</option>
      </select>
    </div>
    <div id="plt-result"></div>
  </div>`;
  document.body.appendChild(ov);calcPltDisp();
}
function calcPltDisp(){
  const tgt=parseFloat(document.getElementById('plt-tgt')?.value);
  const bar=parseFloat(document.getElementById('plt-bar')?.value)||(S.unit==='kg'?20:45);
  const el=document.getElementById('plt-result');if(!el)return;
  if(!tgt){el.innerHTML='';return;}
  const side=(tgt-bar)/2;
  if(side<0){el.innerHTML=`<div style="color:var(--red);font-size:13px;text-align:center;padding:12px">Below bar weight (${bar}${S.unit})</div>`;return;}
  const sets=S.unit==='kg'?[25,20,15,10,5,2.5,1.25]:[45,35,25,10,5,2.5,1.25];
  let rem=side;const plates=[];
  for(const p of sets){const n=Math.floor(rem/p+0.001);if(n>0){plates.push({w:p,n});rem-=p*n;}}
  const all=plates.flatMap(p=>Array(p.n).fill(p.w));
  const cls=w=>{if(w>=45)return'p45';if(w>=35)return'p35';if(w>=25)return'p25';if(w>=10)return'p10';if(w>=5)return'p5';return'p2';};
  el.innerHTML=`<div style="text-align:center;font-size:11px;color:var(--muted);margin-bottom:8px;font-weight:600;letter-spacing:.06em;text-transform:uppercase">Each side · bar ${bar}${S.unit}</div>
    <div class="plate-visual">${all.length?all.map(w=>`<div class="plate ${cls(w)}">${w}</div>`).join(''):'<div style="color:var(--muted);font-size:12px">Just the bar</div>'}</div>
    ${rem>0.01?`<div style="text-align:center;font-size:11px;color:var(--gold);font-weight:600">Note: ${rem.toFixed(2)}${S.unit} remainder</div>`:``}`;
}

function showFinish(){
  const wk=S.activeWorkout;const dur=Date.now()-wk.started;const cals=sessionCals(dur);
  const prs=getPRsFromSess(wk);const diff=getRoutineDiff(wk);
  const ov=makeOv('fin-ov');
  ov.innerHTML=`<div class="modal"><div class="mh"></div><div class="mt">Finish Workout</div>
    <div class="fg"><label class="fl">Name</label><input type="text" id="wkn" value="${wk.name}"></div>

      </div>
    </div>
    ${prs.length?`<div style="background:var(--gdim);border:1px solid rgba(184,124,42,.25);border-radius:8px;padding:9px 12px;margin-bottom:12px;color:var(--gold);font-size:13px;font-weight:600">🏆 New PR${prs.length>1?'s':''}: ${prs.join(', ')}</div>`:''}
    ${diff?`<div style="background:var(--bdim);border:1px solid rgba(42,111,196,.2);border-radius:8px;padding:10px 12px;margin-bottom:12px">
      <div style="font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin-bottom:7px">Routine Changes Detected</div>
      ${diff.added.map(n=>`<div style="color:var(--green);font-size:12px;font-weight:500">+ ${n}</div>`).join('')}
      ${diff.changed.map(n=>`<div style="color:var(--gold);font-size:12px;font-weight:500">~ ${n}</div>`).join('')}
      <div style="margin-top:9px;display:flex;gap:7px">
        <button class="btn btb bsm bfw" onclick="saveRoutineChanges('${wk.routineId}')">Save to Routine</button>
        <button class="btn btg bsm" onclick="this.closest('div[style]').style.display='none'">Skip</button>
      </div>
    </div>`:''}
    <div class="fg"><label class="fl">Notes</label><textarea id="wknt" style="min-height:55px;font-size:13px" placeholder="How did it go?">${wk.notes||''}</textarea></div>
    <button class="btn btp bfw" onclick="saveWorkout()">Save Workout</button>
    <button class="btn btg bfw" style="margin-top:7px" onclick="document.getElementById('fin-ov').remove()">Continue Workout</button>
  </div>`;
  document.body.appendChild(ov);
}
function getPRsFromSess(wk){const names=[];wk.exercises.forEach(ex=>{ex.sets.filter(s=>s.done).forEach(s=>{const w=parseFloat(s.w||0),r=parseInt(s.r||0);if(w&&r){const prev=S.prs[ex.exId];if(!prev||e1rm(w,r)>=e1rm(parseFloat(prev.w),parseInt(prev.r))){const info=getEx(ex.exId);if(info&&!names.includes(info.name))names.push(info.name);}}});});return names;}
function getRoutineDiff(wk){
  if(!wk.routineId||!wk._origExIds)return null;
  const orig=wk._origExIds||[];const now=wk.exercises.map(e=>e.exId);
  const added=now.filter(id=>!orig.includes(id)).map(id=>getEx(id)?.name||id);
  const changed=[];const ls=getLastRSess(wk.routineId);
  if(ls){wk.exercises.filter(ex=>orig.includes(ex.exId)).forEach(ex=>{const prev=ls.exercises.find(e=>e.exId===ex.exId);if(!prev)return;const cW=parseFloat(ex.sets.find(s=>s.done)?.w||0);const pW=parseFloat(prev.sets.find(s=>s.done)?.w||0);if(pW&&cW&&Math.abs(cW-pW)/pW>0.03)changed.push(`${getEx(ex.exId)?.name||ex.exId} (${pW}→${cW}${S.unit})`);});}
  if(!added.length&&!changed.length)return null;return{added,changed};
}
function saveRoutineChanges(rid){
  const wk=S.activeWorkout;const r=S.routines.find(x=>x.id===rid);if(!r||!wk)return;
  wk.exercises.forEach(ex=>{if(!r.exercises.find(e=>e.exId===ex.exId)){const bs=ex.sets.find(s=>s.done)||ex.sets[0];r.exercises.push({exId:ex.exId,sets:ex.sets.length,w:bs?.w||'',r:bs?.r||''});}
  const rEx=r.exercises.find(e=>e.exId===ex.exId);if(!rEx)return;const bd=ex.sets.filter(s=>s.done).sort((a,b)=>parseFloat(b.w||0)-parseFloat(a.w||0))[0];if(bd){rEx.w=bd.w;rEx.r=bd.r;}rEx.sets=ex.sets.length;});
  save();toast('Routine updated!','green');
}
function saveWorkout(){
  const n=document.getElementById('wkn');const nt=document.getElementById('wknt');
  if(n)S.activeWorkout.name=n.value||S.activeWorkout.name;if(nt)S.activeWorkout.notes=nt.value;
  S.activeWorkout.ended=Date.now();S.activeWorkout.cals=sessionCals(S.activeWorkout.ended-S.activeWorkout.started);
  S.workouts.unshift(S.activeWorkout);S.activeWorkout=null;
  if(wtInt)clearInterval(wtInt);skipRest();save();
  document.getElementById('fin-ov')?.remove();toast('Workout saved!','green');render();
}

}

function renderCalendar(){
  const yr=S.calYear,mo=S.calMonth;
  const mName=new Date(yr,mo,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const firstDay=(new Date(yr,mo,1).getDay()+6)%7;
  const daysInMo=new Date(yr,mo+1,0).getDate();
  const td=today();
  let html=`<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 13px;border-bottom:1px solid var(--border)">
    <button class="btn btg bsm" onclick="calNav(-1)">‹ Prev</button>

    <button class="btn btg bsm" onclick="calNav(1)">Next ›</button>
  </div>
  <div style="padding:9px 13px;display:flex;justify-content:flex-end;gap:8px">
    <button class="btn bts bsm" onclick="showLogActivity()">+ Activity</button>
    <button class="btn bts bsm" onclick="showRetroSteps()">+ Steps</button>
  </div>
  <div style="margin:0 13px;border:1px solid var(--border);border-radius:10px;overflow:hidden">
    <div class="cal-grid">
      ${['Mo','Tu','We','Th','Fr','Sa','Su'].map(d=>`<div class="cal-day-hdr">${d}</div>`).join('')}
      ${Array.from({length:firstDay}).map(()=>`<div class="cal-cell empty"></div>`).join('')}`;
  for(let d=1;d<=daysInMo;d++){
    const ds=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=ds===td;const isFuture=ds>td;
    const hasWk=S.workouts.some(w=>new Date(w.started).toISOString().split('T')[0]===ds);
    const hasAct=S.activities.some(a=>a.date===ds);
    const logs=S.suppLogs[ds]||{};const suppPct=S.supps.length?S.supps.filter(s=>logs[s.id]).length/S.supps.length:null;
    const hasSteps=!!(S.stepsLog[ds]&&S.stepsLog[ds]>0);
    const dots=[];
    if(hasWk)dots.push('#1e3558');if(hasAct)dots.push('#b87c2a');
    if(suppPct!=null&&!isFuture)dots.push(suppPct===1?'#2d7a52':suppPct>0?'#c4842a':'#e2dbd2');
    if(hasSteps)dots.push('#8a8070');
    html+=`<div class="cal-cell${isToday?' today':''}" style="${isFuture?'opacity:.4':''}" onclick="${!isFuture?`showDayDetail('${ds}')`:''}""><div class="cal-date">${d}</div><div class="cal-dots">${dots.map(c=>`<div class="cal-dot" style="background:${c}"></div>`).join('')}</div></div>`;
  }
  html+=`</div></div><div style="padding:10px 13px;display:flex;gap:12px;flex-wrap:wrap;font-size:10px;color:var(--muted);font-weight:500">
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#1e3558;margin-right:3px"></span>Workout</span>
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#b87c2a;margin-right:3px"></span>Activity</span>
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#2d7a52;margin-right:3px"></span>All supps</span>
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#8a8070;margin-right:3px"></span>Steps</span>
  </div>`;
  return html;
}

function renderDashCard(card){

function toggleCard(id){

}
function getCardHeaderData(id){
  const empty={sub:'No data yet',spark:''};
  switch(id){
    case 'weekly':{const ago=Date.now()-7*86400000;const sess=S.workouts.filter(w=>w.started>=ago);const sets=sess.reduce((t,wk)=>t+doneSetCnt(wk),0);const cals=sess.reduce((t,wk)=>t+(wk.cals||0),0)+S.activities.filter(a=>new Date(a.date+'T12:00:00').getTime()>ago).reduce((t,a)=>t+(a.cals||0),0);return{sub:`${sess.length} sessions · ${sets} sets · ~${cals} kcal`,spark:''};}
    case 'strength':{const exs=getExsWithHist();if(!exs.length)return empty;const exId=S.progExId||exs[0];const data=getExStrData(exId).map(d=>d.maxW);return{sub:getEx(exId)?.name||'No exercises',spark:sparkline(data.slice(-8),'#1e3558')};}
    case 'prs':{const cnt=Object.keys(S.prs).length;return{sub:`${cnt} PR${cnt!==1?'s':''} logged`,spark:''};}
    case 'volume':{const ago=Date.now()-7*86400000;const sbm={};S.workouts.filter(w=>w.started>=ago).forEach(wk=>wk.exercises.forEach(ex=>{const inf=getEx(ex.exId);if(!inf?.muscle)return;sbm[inf.muscle]=(sbm[inf.muscle]||0)+ex.sets.filter(s=>s.done).length;}));const neg=Object.entries(MEV_MAV).filter(([m,mm])=>(sbm[m]||0)<mm.mev).length;const opt=Object.entries(MEV_MAV).filter(([m,mm])=>{const s=sbm[m]||0;return s>=mm.mev&&s<=mm.mav;}).length;return{sub:neg>0?`${neg} groups need attention`:`${opt} groups at optimal volume`,spark:''};}
    case 'bodyweight':{const bwL=S.bodyweightLog||[];const curr=bwL[0]?.weight||S.bodyweight;const chg=bwL.length>=2?(bwL[0].weight-bwL[bwL.length-1].weight).toFixed(1):null;return{sub:`${curr} ${S.unit}${chg?` · ${parseFloat(chg)>0?'+'+chg:chg} overall`:''}`,spark:sparkline(bwL.slice(-10).map(e=>e.weight).reverse(),'#2d7a52')};}
    case 'measurements':{const lat=(S.measurements||[])[0];if(!lat)return{sub:'No measurements logged',spark:''};const arm=lat.values.rightArm||lat.values.leftArm;return{sub:`Arms: ${arm||'–'}" · Waist: ${lat.values.waist||'–'}"`,spark:''};}
    case 'standards':{const lvls=getStdLevels();const top=lvls.reduce((b,l)=>l.level>b?l.level:b,0);return{sub:top>0?`Highest: ${STD_LABELS[top-1]}`:'Log key lifts to see standards',spark:''};}
    case 'wilks':{const wd=getWilksData();return{sub:wd?`Wilks ${wd.wilks} · DOTS ${wd.dots}`:'Need Squat + Bench + Deadlift PRs',spark:''};}
    case 'aft':{const ag=S.aftAge||'22-26';const gn=S.aftGender||'male';let tot=0,ec=0;AFT_EVENTS.forEach(ev=>{const sc=aftScore(ev.id,S.aftCurrent[ev.id],ag,gn);if(sc!=null){tot+=sc;ec++;}});const histData=(S.aftHistory||[]).slice(0,8).reverse().map(t=>AFT_EVENTS.reduce((s,ev)=>s+(aftScore(ev.id,t[ev.id],t.age,t.gender)||0),0));return{sub:ec>0?`${tot}/500 · ${ec}/5 events`:' Enter scores below',spark:sparkline(histData,'#1e3558')};}
    case 'consistency':{const streak=getStreak();return{sub:`${streak} day streak`,spark:sparkline(getWeeklyActivity(8),'#b87c2a')};}
    case 'recovery':{const{warnings}=getRecoveryData();return{sub:warnings.length?`${warnings.length} muscle group${warnings.length>1?'s':''} at high load`:'Recovery load: Good',spark:''};}
    case 'rucking':{const wkR=S.activities.filter(a=>a.type==='ruck'&&new Date(a.date+'T12:00:00').getTime()>Date.now()-7*86400000);const dist=wkR.reduce((t,a)=>t+(parseFloat(a.dist)||0),0).toFixed(1);const l4=Array.from({length:4},(_,i)=>{const end=new Date();end.setDate(end.getDate()-(3-i)*7);const start=new Date(end);start.setDate(start.getDate()-7);return S.activities.filter(a=>a.type==='ruck'&&new Date(a.date+'T12:00:00').getTime()>=start.getTime()&&new Date(a.date+'T12:00:00').getTime()<end.getTime()).reduce((t,a)=>t+(parseFloat(a.dist)||0),0);});return{sub:`${dist}mi rucking this week`,spark:sparkline(l4,'#b87c2a')};}
    default:return empty;
  }
}
function getCardBody(id){

}

  const td=today();const steps=Object.entries(S.stepsLog).filter(([d])=>new Date(d+'T12:00:00').getTime()>ago).reduce((t,[,v])=>t+v,0);
  return`<div class="sgrid" style="background:var(--border)">

  let html=`<div class="ph"><div class="page-title">Supplements</div><button class="btn btp bsm" onclick="showAddSupp()">+ Add</button></div>

    html+=`</div>`;
    html+=`<div class="sec-lbl">7-Day Compliance</div><div class="card"><div class="cb" style="display:flex;gap:5px">`;
    for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const ds=d.toISOString().split('T')[0];const dl=S.suppLogs[ds]||{};const dc=S.supps.filter(s=>dl[s.id]).length;const pct=S.supps.length?Math.round((dc/S.supps.length)*100):0;const col=pct===100?'var(--green)':pct>50?'var(--gold)':pct>0?'var(--navy)':'var(--border)';html+=`<div style="flex:1;text-align:center"><div style="width:100%;aspect-ratio:1;border-radius:5px;background:${col};margin-bottom:3px"></div><div style="font-size:9px;color:var(--muted);font-weight:500">${d.toLocaleDateString('en-US',{weekday:'narrow'})}</div></div>`;}

  }
  c.innerHTML=html;
}

    <div class="fg"><label class="fl">Goal</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">
        ${GOALS.map(g=>`<div class="goal-card${S.goal===g.id?' on':''}" onclick="S.goal='${g.id}';save();document.querySelectorAll('[id^=gc2-]').forEach(el=>el.classList.remove('on'));this.classList.add('on')"><div style="font-size:16px;margin-bottom:3px">${g.icon}</div><div style="font-size:12px;font-weight:600">${g.label}</div></div>`).join('')}
      </div>
    </div>
    <div class="fg"><label class="fl">Weight Unit</label>
      <div class="frow">
        <button class="btn ${S.unit==='lbs'?'btp':'bts'} bfw" onclick="S.unit='lbs';save();this.className='btn btp bfw';this.nextSibling.className='btn bts bfw'">lbs</button>
        <button class="btn ${S.unit==='kg'?'btp':'bts'} bfw" onclick="S.unit='kg';save();this.className='btn btp bfw';this.previousSibling.className='btn bts bfw'">kg</button>
      </div>
    </div>
    <div class="fg"><label class="fl">Bodyweight (${S.unit})</label><input type="number" inputmode="decimal" value="${S.bodyweight||185}" onchange="S.bodyweight=parseFloat(this.value)||185;save()"></div>
    <div class="fg"><label class="fl">Gender (for Wilks &amp; AFT)</label>
      <div class="frow">
        <button class="btn ${S.aftGender==='male'?'btp':'bts'} bfw" onclick="S.aftGender='male';save();this.className='btn btp bfw';this.nextSibling.className='btn bts bfw'">Male</button>
        <button class="btn ${S.aftGender==='female'?'btp':'bts'} bfw" onclick="S.aftGender='female';save();this.className='btn btp bfw';this.previousSibling.className='btn bts bfw'">Female</button>
      </div>
    </div>
    <div class="fg"><label class="fl">Default Rest: <span id="rdlbl">${S.restDur}s</span></label><input type="range" min="30" max="300" step="15" value="${S.restDur}" oninput="S.restDur=parseInt(this.value);document.getElementById('rdlbl').textContent=this.value+'s';save()"></div>
    <div class="fg"><label class="fl">Appearance</label>
      <button class="btn bts bfw" onclick="toggleDark();this.textContent=S.darkMode?'☀️ Light Mode':'🌙 Dark Mode'">${S.darkMode?'☀️ Light Mode':'🌙 Dark Mode'}</button>
    </div>
    <div class="fg" style="border-top:1px solid var(--border);padding-top:13px;margin-top:4px">
      <label class="fl">Data</label>
      <div style="display:flex;gap:8px">
        <button class="btn bts bfw" onclick="exportData()">⬇ Export Backup</button>
        <button class="btn bts bfw" onclick="importData()">⬆ Import</button>
      </div>
    </div>
    <div class="fg"><button class="btn btd bfw" onclick="confirmReset()">Reset All Data</button></div>
    <button class="btn btg bfw" style="margin-top:4px" onclick="document.getElementById('set-ov').remove();render()">Done</button>
  </div>`;
  document.body.appendChild(ov);
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=`lahwe-backup-${today()}.json`;a.click();URL.revokeObjectURL(url);
  toast('Exported!','green');
}
function importData(){
  const input=document.createElement('input');input.type='file';input.accept='.json';
  input.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{try{const data=JSON.parse(ev.target.result);if(!data.workouts||!Array.isArray(data.workouts)){toast('Invalid backup file');return;}Object.assign(S,data);save();document.querySelectorAll('.ov').forEach(el=>el.remove());render();toast('Data imported!','green');}catch(e){toast('Failed to parse file');}};
    reader.readAsText(file);
  };
  input.click();
}
function confirmReset(){customConfirm('All workouts, PRs, and settings will be permanently deleted.','Reset everything',()=>{localStorage.removeItem('lahwe_v1');initState();document.querySelectorAll('.ov').forEach(el=>el.remove());render();toast('Reset complete');});}

// ════════════════════════════════════════════
// PWA
// ════════════════════════════════════════════
function injectManifest(){
  const m={name:'Lah We',short_name:'Lah We',start_url:'.',display:'standalone',background_color:'#f5f1ec',theme_color:'#f5f1ec',
    icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' fill='%231e3558'/%3E%3Ctext x='50%25' y='55%25' font-family='sans-serif' font-size='80' font-weight='700' fill='white' text-anchor='middle' dominant-baseline='middle'%3ELW%3C/text%3E%3C/svg%3E",sizes:'192x192',type:'image/svg+xml'}]};
  const blob=new Blob([JSON.stringify(m)],{type:'application/manifest+json'});
  const link=document.createElement('link');link.rel='manifest';link.href=URL.createObjectURL(blob);document.head.appendChild(link);
}

// ════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════
load();injectManifest();render();
if(S.activeWorkout)startWtTimer();
</script>
</body>
