<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lah We">
<meta name="theme-color" content="#f5f1ec">
<title>Lah We</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f5f1ec;--bg2:#ede8e1;--card:#fff;--border:#e2dbd2;
  --navy:#1e3558;--ndim:rgba(30,53,88,.07);--nbright:rgba(30,53,88,.12);
  --gold:#b87c2a;--gdim:rgba(184,124,42,.1);
  --green:#2d7a52;--grdim:rgba(45,122,82,.08);--grbright:rgba(45,122,82,.14);
  --red:#b83c3c;--rdim:rgba(184,60,60,.08);
  --blue:#2a6fc4;--bdim:rgba(42,111,196,.08);
  --purple:#7a4fc4;--pdim:rgba(122,79,196,.08);
  --text:#1a1816;--muted:#8a8070;--muted2:#c4bdb2;
  --nh:58px;--sb:env(safe-area-inset-bottom,0px);--r:16px;
}
[data-dark="true"]{
  --bg:#0f0e0d;--bg2:#1a1917;--card:#1e1d1b;--border:#2e2b28;
  --ndim:rgba(30,53,88,.28);--nbright:rgba(30,53,88,.4);
  --gdim:rgba(184,124,42,.18);--grdim:rgba(45,122,82,.16);--grbright:rgba(45,122,82,.22);
  --rdim:rgba(184,60,60,.16);--bdim:rgba(42,111,196,.18);--pdim:rgba(122,79,196,.16);
  --text:#f0ede8;--muted:#7a7468;--muted2:#3a3830;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;overflow:hidden;transition:background .2s,color .2s}
#app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;position:relative;overflow:hidden}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nh) + var(--sb) + 52px);scroll-behavior:smooth}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--border);display:flex;align-items:flex-start;padding-top:10px;padding-bottom:calc(var(--sb) + 16px);z-index:100}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--muted2);cursor:pointer;padding:2px 0;transition:color .15s}
.nb.on{color:var(--navy)}.nb svg{width:21px;height:21px;transition:transform .15s}.nb.on svg{transform:scale(1.08)}
.nb span{font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
#rest-float{position:fixed;bottom:calc(var(--nh) + var(--sb) + 24px);right:14px;z-index:150;display:none;cursor:pointer;filter:drop-shadow(0 4px 12px rgba(0,0,0,.15))}
#rest-float.on{display:block;animation:popin .2s ease}
@keyframes popin{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
#rest-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-52%);text-align:center;pointer-events:none}
#rest-time{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:500;color:var(--navy);display:block;line-height:1}
#rest-word{font-size:8px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:1px;display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin:0 13px 10px;overflow:hidden}
.ch{padding:11px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.ct{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.cb{padding:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:9px;border:none;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .12s;user-select:none;letter-spacing:-.01em}
.btn:active{opacity:.82;transform:scale(.97)}
.btp{background:var(--navy);color:#fff}.bts{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btg{background:transparent;color:var(--muted)}.btd{background:var(--red);color:#fff}
.btok{background:var(--green);color:#fff}.btb{background:var(--bdim);color:var(--blue);border:1px solid rgba(42,111,196,.2)}
.bfw{width:100%}.bsm{padding:7px 12px;font-size:13px}.bxs{padding:4px 8px;font-size:11px}
.delbtn{background:transparent;border:1px solid var(--border);color:var(--red)}.delbtn:active{background:var(--rdim)}
input,select,textarea{background:var(--bg);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;padding:9px 11px;width:100%;outline:none;transition:border-color .12s;-webkit-appearance:none;-moz-appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--navy);background:var(--card)}
input[type=number]{font-family:'IBM Plex Mono',monospace;text-align:center;font-size:16px}
input[type=date]{font-family:'DM Sans',sans-serif;font-size:14px}
select option{background:var(--card)}
textarea{resize:none;line-height:1.5}
.ov{position:fixed;inset:0;background:rgba(8,6,4,.6);z-index:200;display:flex;align-items:flex-end;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.modal{background:var(--card);border-top:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-height:93vh;overflow-y:auto;padding:10px 14px calc(18px + var(--sb));animation:su .22s cubic-bezier(.22,.61,.36,1);-webkit-overflow-scrolling:touch;touch-action:pan-y}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mh{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 15px;cursor:grab;touch-action:none}
.mh:active{cursor:grabbing}
.mt{font-size:18px;font-weight:600;margin-bottom:14px;letter-spacing:-.02em}
.page-title{font-size:21px;font-weight:600;letter-spacing:-.02em}
.sec-lbl{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:12px 13px 6px}
.mono{font-family:'IBM Plex Mono',monospace}
.ph{padding:15px 13px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.fbar{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--border);padding:9px 13px;display:flex;align-items:center;gap:9px}
.fbar-name{flex:1;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.wt{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--navy);background:var(--ndim);padding:3px 7px;border-radius:5px;letter-spacing:.02em}
.exb{margin:0 13px 10px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.exbh{padding:11px 13px;background:var(--bg);border-bottom:1px solid var(--border)}
.exbn{font-size:14px;font-weight:600;letter-spacing:-.01em}
.exbc{font-size:11px;color:var(--muted);margin-top:1px}
.ex-last{font-size:11px;color:var(--green);font-weight:500;margin-top:2px}
.slbls{display:grid;grid-template-columns:22px 1fr 1fr 50px 30px 22px;gap:4px;padding:4px 10px;background:var(--bg)}
.sl{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted2);text-align:center}
.srow{display:grid;grid-template-columns:22px 1fr 1fr 50px 30px 22px;gap:4px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--border)}
.srow:last-child{border-bottom:none}.srow.done{background:rgba(45,122,82,.04)}
.snum{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted2);text-align:center}
.sinp{padding:6px 3px;font-size:15px;border-radius:7px}
.sinp:disabled{background:transparent;border-color:transparent;color:var(--text)}
.e1rm-cell{display:flex;align-items:center;justify-content:center}
.e1rm-badge{font-family:'IBM Plex Mono',monospace;font-size:9px;padding:2px 4px;border-radius:4px;background:var(--bg2);color:var(--muted);border:1px solid var(--border);text-align:center;white-space:nowrap}
.e1rm-badge.pr{color:var(--gold);border-color:rgba(184,124,42,.3);background:var(--gdim)}
.chk{width:28px;height:28px;border-radius:7px;border:1.5px solid var(--border);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s;color:transparent;font-size:13px;flex-shrink:0}
.chk.done{background:var(--green);border-color:var(--green);color:#fff}
.tag-btn{width:20px;height:28px;border-radius:5px;border:1px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted2);flex-shrink:0;transition:all .1s}
.tag-btn.tagged{border-color:var(--gold);color:var(--gold)}
.tag-row{display:flex;gap:5px;padding:5px 10px 7px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.tag-chip{padding:3px 9px;border-radius:10px;border:1px solid var(--border);background:var(--bg);font-size:11px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .1s}
.tag-chip.on{border-color:var(--navy);background:var(--ndim);color:var(--navy)}
.tag-chip.pain{border-color:var(--red);background:var(--rdim);color:var(--red)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}
.sc{background:var(--card);padding:11px 13px}
.sv{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:500}
.slb{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.hi{display:flex;align-items:center;padding:12px 13px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.hi:last-child{border-bottom:none}
.hi:active{background:var(--bg)}
.hn{font-size:14px;font-weight:600;letter-spacing:-.01em}
.hm{font-size:11px;color:var(--muted);margin-top:2px}
.sui{display:flex;align-items:center;padding:11px 13px;border-bottom:1px solid var(--border)}
.sui:last-child{border-bottom:none}
.tog{width:46px;height:26px;border-radius:13px;border:1.5px solid var(--border);background:transparent;cursor:pointer;position:relative;transition:all .18s;flex-shrink:0}
.tog::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:var(--muted2);top:3px;left:3px;transition:all .18s}
.tog.on{border-color:var(--green);background:rgba(45,122,82,.12)}
.tog.on::after{background:var(--green);transform:translateX(20px)}
.exi{display:flex;align-items:center;padding:11px 13px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.exi:last-child{border-bottom:none}
.exi:active{background:var(--bg)}
.exin{font-size:14px;font-weight:500;flex:1;letter-spacing:-.01em}
.badge{font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;letter-spacing:.01em}
.bg{background:var(--gdim);color:var(--gold)}
.ba{background:var(--ndim);color:var(--navy)}
.sw{padding:9px 13px;border-bottom:1px solid var(--border)}
.fr{display:flex;gap:6px;padding:7px 13px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border)}
.fr::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;transition:all .12s}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.ptabs{display:flex;border-bottom:1px solid var(--border);padding:0 13px;overflow-x:auto;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptab{flex-shrink:0;padding:10px 12px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;transition:all .12s;background:none;border-top:none;border-left:none;border-right:none;margin-bottom:-1px}
.ptab.on{color:var(--navy);border-bottom-color:var(--navy)}
.fg{margin-bottom:12px}
.fl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;display:block}
.frow{display:flex;align-items:center;gap:8px}
.ib{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:14px;transition:all .1s}
.ib:active{background:var(--bg)}
.empty{text-align:center;padding:52px 24px;color:var(--muted)}
.etit{font-size:16px;font-weight:600;color:var(--text);margin-bottom:5px;letter-spacing:-.01em}
.chart-wrap{padding:12px;position:relative;height:200px}
.toast{position:fixed;top:22px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;z-index:999;animation:tin .18s ease,tout .22s ease 2s both;white-space:nowrap;color:var(--text);box-shadow:0 4px 20px rgba(0,0,0,.1)}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes tout{to{opacity:0;transform:translateX(-50%) translateY(-4px)}}
.wsr{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.wsr:last-child{border-bottom:none}
.afill-tag{font-size:9px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--green);background:var(--grdim);border-radius:3px;padding:1px 5px;margin-left:5px}
.ol-badge{font-size:9px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--blue);background:var(--bdim);border-radius:3px;padding:1px 5px;margin-left:5px;border:1px solid rgba(42,111,196,.18)}
.pain-banner{margin:8px 13px;padding:10px 13px;background:var(--rdim);border:1px solid rgba(184,60,60,.22);border-radius:10px;font-size:12px;color:var(--red);font-weight:600}
.plate-visual{display:flex;flex-wrap:wrap;gap:5px;padding:12px;background:var(--bg);border-radius:8px;margin-bottom:10px;align-items:center;justify-content:center;min-height:52px}
.plate{display:inline-flex;align-items:center;justify-content:center;border-radius:5px;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:11px;padding:6px 9px;border:2px solid}
.p45{background:#1e3558;color:#fff;border-color:#1e3558}.p35{background:#b87c2a;color:#fff;border-color:#b87c2a}
.p25{background:#2d7a52;color:#fff;border-color:#2d7a52}.p10{background:#2a6fc4;color:#fff;border-color:#2a6fc4}
.p5{background:#b83c3c;color:#fff;border-color:#b83c3c}.p2{background:var(--bg2);color:var(--text);border-color:var(--border)}
.macro-bar-track{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0 2px}
.macro-bar-fill{height:100%;border-radius:3px;transition:width .35s ease}
.sched-day{width:38px;height:40px;border-radius:9px;border:1.5px solid var(--border);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .12s;font-size:9px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);gap:2px}
.sched-day.on{background:var(--navy);border-color:var(--navy);color:#fff}
.eq-preset{border:1px solid var(--border);border-radius:var(--r);padding:13px;cursor:pointer;transition:all .12s;background:var(--card);display:flex;align-items:center;gap:10px}
.eq-preset:active{background:var(--bg)}.eq-preset.on{border-color:var(--navy);background:var(--ndim)}
.insight-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;cursor:pointer;transition:all .12s}
.insight-card:active{background:var(--bg)}
.dash-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin:0 13px 10px;overflow:hidden}
.dash-hdr{display:flex;align-items:center;gap:10px;padding:13px;cursor:pointer;user-select:none;transition:background .1s}
.dash-hdr:active{background:var(--bg)}
.dash-icon{font-size:16px;flex-shrink:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--bg2);border-radius:9px}
.dash-info{flex:1;min-width:0}
.dash-title{font-size:14px;font-weight:600;letter-spacing:-.01em}
.dash-sub{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash-chev{color:var(--muted2);font-size:18px;transition:transform .2s;line-height:1;flex-shrink:0}
.dash-chev.open{transform:rotate(90deg)}
.dash-body{border-top:1px solid var(--border)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border)}
.cal-day-hdr{background:var(--bg);padding:6px 0;text-align:center;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.cal-cell{background:var(--card);padding:5px 3px;min-height:48px;cursor:pointer;transition:background .1s}
.cal-cell:active{background:var(--bg)}.cal-cell.empty{background:var(--bg);cursor:default}
.cal-cell.today .cal-date{background:var(--navy);color:#fff;border-radius:50%}
.cal-cell.rest-day{background:rgba(30,53,88,.02)}
.cal-date{width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;margin:0 auto 2px}
.cal-dots{display:flex;justify-content:center;gap:2px;flex-wrap:wrap;min-height:7px}
.cal-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.act-icon{width:32px;height:32px;border-radius:8px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;margin-right:10px}
.mvrow{display:flex;align-items:center;padding:9px 13px;border-bottom:1px solid var(--border)}
.mvrow:last-child{border-bottom:none}
.mvname{flex:1;font-size:12px;font-weight:500}
.aft-total{background:var(--navy);color:#fff;margin:0 13px 10px;border-radius:var(--r);padding:15px}
.aft-bar-track{height:6px;background:rgba(255,255,255,.15);border-radius:3px;margin:6px 0 3px;position:relative}
.aft-bar-fill{height:100%;border-radius:3px;transition:width .35s ease}
.aft-bar-goal{position:absolute;top:-4px;width:2px;height:14px;background:#fff;border-radius:1px;opacity:.5}
.aft-row{padding:10px 13px;border-bottom:1px solid var(--border)}
.aft-row:last-child{border-bottom:none}
.meas-chg{font-size:10px;font-weight:600;margin-left:6px}
/* Home hyped cards */
.hype-section{margin:0 13px 10px}
.routine-today{background:var(--navy);border-radius:var(--r);padding:16px;color:#fff;position:relative;overflow:hidden}
.routine-today::before{content:'';position:absolute;right:-20px;top:-20px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.04)}
.routine-today::after{content:'';position:absolute;right:20px;bottom:-30px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.03)}
.stat-mini{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 11px;text-align:center}
.stat-mini-val{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:500}
.stat-mini-lbl{font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:2px}
</style>
</head>
<body>
<div id="app">
  <div id="rest-float" onclick="skipRest()">
    <svg width="64" height="64" viewBox="0 0 66 66"><circle cx="33" cy="33" r="28" fill="var(--card)" stroke="var(--border)" stroke-width="2.5"/><circle id="rc" cx="33" cy="33" r="28" fill="none" stroke="var(--navy)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="176" stroke-dashoffset="176" transform="rotate(-90 33 33)" style="transition:stroke-dashoffset 1s linear"/></svg>
    <div id="rest-label"><span id="rest-time">1:30</span><span id="rest-word">REST</span></div>
  </div>
  <div id="content"></div>
  <nav id="nav">
    <button class="nb on" onclick="go('workout')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4v6a6 6 0 0 0 12 0V4"/><line x1="6" y1="20" x2="18" y2="20"/><line x1="4" y1="6" x2="6" y2="6"/><line x1="18" y1="6" x2="20" y2="6"/><line x1="4" y1="8" x2="6" y2="8"/><line x1="18" y1="8" x2="20" y2="8"/></svg>
      <span>Workout</span>

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function today(){return new Date().toISOString().split('T')[0];}
function fmtDate(iso){if(!iso)return'';return new Date(iso).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});}
function fmtShort(iso){if(!iso)return'';return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function fmtDur(ms){const m=Math.floor(ms/60000),h=Math.floor(m/60);return h>0?`${h}h ${m%60}m`:`${m}m`;}
function fmtTimer(s){const m=Math.floor(s/60),sec=s%60;return`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;}
function e1rm(w,r){return r===1?w:Math.round(w*(1+r/30));}
function allEx(){return[...EXERCISES,...(S.custom||[])];}
function getEx(id){return allEx().find(e=>e.id===id);}
function totalVol(wk){return wk.exercises.reduce((t,ex)=>t+ex.sets.filter(s=>s.done).reduce((a,s)=>a+(parseFloat(s.w||0)*parseInt(s.r||0)),0),0);}
function doneSetCnt(wk){return wk.exercises.reduce((t,ex)=>t+ex.sets.filter(s=>s.done).length,0);}
function bwKg(){return(S.bodyweight||185)/2.205;}
function sessionCals(ms){return Math.round(4.5*bwKg()*(ms/3600000));}
function activityCals(act){
  const t=ACT_TYPES.find(a=>a.id===act.type)||{mets:5};
  const dh=(parseFloat(act.dur)||0)/60;
  if(act.type==='ruck'){const tf={flat:1,hilly:1.3,trail:1.2,mixed:1.15}[act.terrain||'flat'];return Math.round(0.30*((S.bodyweight||185)+(parseFloat(act.ruckWeight)||0))*(parseFloat(act.dist)||0)*tf);}
  return Math.round(t.mets*bwKg()*dh);
}

// ─── Schedule ───
function isTrainingDay(ds){
  const sch=S.schedule;if(!sch)return true;
  const ov=sch.overrides&&sch.overrides[ds];
  if(ov)return ov==='active';
  const rovRid=sch.routineOverrides&&sch.routineOverrides[ds];
  if(rovRid==='rest')return false;
  if(rovRid)return true;
  if(sch.type==='weekly'){
    const dow=new Date(ds+'T12:00:00').getDay();
    return(sch.weeklyDays||[1,2,4,5]).includes(dow);
  }
  if(sch.type==='cycle'){
    const on=parseInt(sch.cycleOn)||2,off=parseInt(sch.cycleOff)||1;
    const start=new Date((sch.cycleStart||today())+'T00:00:00');
    const diff=Math.round((new Date(ds+'T00:00:00')-start)/86400000);
    const pos=((diff%(on+off))+(on+off))%(on+off);
    return pos<on;
  }
  return true;
}
function getStreak(){
  const actDates=new Set([
    ...S.workouts.map(w=>new Date(w.started).toISOString().split('T')[0]),
    ...S.activities.map(a=>a.date)
  ]);
  let n=0;const dt=new Date();
  while(true){
    const ds=dt.toISOString().split('T')[0];
    if(ds>today()){dt.setDate(dt.getDate()-1);continue;}
    const hasAct=actDates.has(ds);
    const isRest=!isTrainingDay(ds);
    if(!hasAct&&!isRest)break;
    if(hasAct)n++;
    dt.setDate(dt.getDate()-1);
  }
  return n;
}

// ─── Workout intelligence ───
function getExStrData(exId){
  const r=[];
  S.workouts.slice().reverse().forEach(wk=>{
    const ex=wk.exercises.find(e=>e.exId===exId);if(!ex)return;
    const done=ex.sets.filter(s=>s.done&&parseFloat(s.w)>0);if(!done.length)return;
    const mw=Math.max(...done.map(s=>parseFloat(s.w)));
    r.push({label:fmtShort(new Date(wk.started).toISOString()),date:wk.started,maxW:mw,
      vol:done.reduce((t,s)=>t+(parseFloat(s.w)*parseInt(s.r||0)),0),
      e1rm:e1rm(mw,done.find(s=>parseFloat(s.w)===mw)?.r||1)});
  });
  return r;
}
function getExsWithHist(){
  const ids=new Set();
  S.workouts.forEach(wk=>wk.exercises.forEach(ex=>{if(ex.sets.some(s=>s.done&&parseFloat(s.w)>0))ids.add(ex.exId);}));
  return[...ids];
}
function getProgressWins(exIds){
  const wins=[];
  (exIds||getExsWithHist()).forEach(exId=>{
    const hist=getExStrData(exId);
    if(hist.length<3)return;
    const newest=hist[hist.length-1].e1rm;
    const oldest=hist[0].e1rm;
    const pct=oldest>0?Math.round((newest-oldest)/oldest*100):0;
    if(pct>=5)wins.push({exId,name:getEx(exId)?.name,pct,sessions:hist.length});
  });
  return wins.sort((a,b)=>b.pct-a.pct).slice(0,2);
}
function getPRProximity(){
  const results=[];
  Object.entries(S.prs).forEach(([exId,pr])=>{
    const hist=getExStrData(exId);if(!hist.length)return;
    const recent=hist[hist.length-1];
    const gap=pr.est-recent.e1rm;
    if(gap>0&&gap<=pr.est*0.08)results.push({exId,name:getEx(exId)?.name,gap,prEst:pr.est});
  });
  return results.slice(0,1);
}
function getVolumeMomentum(){
  const muscles={};
  for(let w=0;w<3;w++){
    const s=Date.now()-(w+1)*7*86400000,e=Date.now()-w*7*86400000;
    S.workouts.filter(wk=>wk.started>=s&&wk.started<e).forEach(wk=>{
      wk.exercises.forEach(ex=>{
        const info=getEx(ex.exId);if(!info?.muscle)return;
        const sets=ex.sets.filter(s=>s.done).length;
        if(!muscles[info.muscle])muscles[info.muscle]=[0,0,0];
        muscles[info.muscle][w]+=sets;
      });
    });
  }
  const results=[];
  Object.entries(muscles).forEach(([m,[w0,w1,w2]])=>{
    if(w0>0&&w0>w1&&w1>w2)results.push({muscle:MEV_MAV[m]?.lbl||m,weeks:3,val:w0});
    else if(w0>0&&w0>w1)results.push({muscle:MEV_MAV[m]?.lbl||m,weeks:2,val:w0});
  });
  return results.filter(r=>r.weeks>=2).sort((a,b)=>b.weeks-a.weeks).slice(0,1);
}
function getStagnantExercises(exIds){
  const stag=[];
  (exIds||[]).forEach(exId=>{
    const hist=getExStrData(exId);if(hist.length<3)return;
    const last3=hist.slice(-3).map(h=>h.e1rm);
    const mx=Math.max(...last3),mn=Math.min(...last3);
    if(mx-mn<=1)stag.push({exId,name:getEx(exId)?.name,sessions:3});
  });
  return stag.slice(0,2);
}
function getPainWarnings(){
  const w=[];
  const ids=new Set(S.workouts.slice(0,10).flatMap(wk=>wk.exercises.map(e=>e.exId)));
  ids.forEach(exId=>{
    const sess=S.workouts.filter(wk=>wk.exercises.some(e=>e.exId===exId)).slice(0,3);
    const pc=sess.filter(wk=>wk.exercises.find(e=>e.exId===exId)?.sets.some(s=>s.done&&s.tag==='Pain')).length;
    if(pc>=2)w.push({exId,name:getEx(exId)?.name||exId,sessions:pc});
  });
  return w;
}
function getExPainLevel(exId){
  return S.workouts.filter(wk=>wk.exercises.some(e=>e.exId===exId)).slice(0,3)
    .filter(wk=>wk.exercises.find(e=>e.exId===exId)?.sets.some(s=>s.done&&s.tag==='Pain')).length;
}
function checkProgressiveOverload(exId){
  const sessions=S.workouts.filter(w=>w.exercises.some(e=>e.exId===exId)).slice(0,2);
  if(sessions.length<2)return null;
  const allComplete=sessions.every(wk=>{
    const ex=wk.exercises.find(e=>e.exId===exId);
    return ex&&ex.sets.length>0&&ex.sets.every(s=>s.done);
  });
  if(!allComplete)return null;
  const ex=getEx(exId);if(!ex)return null;
  if(ex.eq==='Bodyweight')return{type:'reps',amount:1};
  const iso=['Biceps Brachii','Triceps Brachii','Deltoids','Rectus Abdominis','Gastrocnemius/Soleus','Trapezius'];
  const isIso=iso.includes(ex.muscle)&&ex.cat!=='Full Body';
  return{type:'weight',amount:S.unit==='kg'?(isIso?1.25:2.5):(isIso?2.5:5),unit:S.unit};
}
function getRecentExIds(n=8){
  const ids=[];
  for(const wk of S.workouts){for(const ex of wk.exercises){if(!ids.includes(ex.exId))ids.push(ex.exId);}if(ids.length>=n)break;}
  return ids.slice(0,n);
}
function getWeeklyActivity(nw=12){
  return Array.from({length:nw},(_,i)=>{
    const end=new Date();end.setDate(end.getDate()-(nw-1-i)*7);
    const start=new Date(end);start.setDate(start.getDate()-7);
    return S.workouts.filter(w=>w.started>=start.getTime()&&w.started<end.getTime()).length+
      S.activities.filter(a=>{const t=new Date(a.date+'T12:00:00').getTime();return t>=start.getTime()&&t<end.getTime();}).length;
  });
}
function getRecoveryData(){
  const ago=Date.now()-21*86400000;
  const bkts=[[Date.now()-7*86400000,Date.now()],[Date.now()-14*86400000,Date.now()-7*86400000],[Date.now()-21*86400000,Date.now()-14*86400000]];
  const ws=bkts.map(()=>{const m={};Object.keys(MEV_MAV).forEach(k=>m[k]=0);return m;});
  S.workouts.filter(w=>w.started>=ago).forEach(wk=>{
    const bi=bkts.findIndex(([s,e])=>wk.started>=s&&wk.started<e);if(bi<0)return;
    wk.exercises.forEach(ex=>{const info=getEx(ex.exId);if(!info?.muscle)return;ws[bi][info.muscle]=(ws[bi][info.muscle]||0)+ex.sets.filter(s=>s.done).length;});
  });
  const warnings=[];
  Object.entries(MEV_MAV).forEach(([m,mm])=>{if(ws.filter(w=>(w[m]||0)>mm.mav).length>=2)warnings.push({muscle:mm.lbl});});
  return{ws,warnings};
}
function getWilksData(){
  const pr=S.prs;
  const sq=pr['squat']||pr['front-squat']||pr['hex-dl'];
  const bench=pr['bb-bench']||pr['inc-bench'];
  const dl=pr['deadlift']||pr['sumo-dl'];
  if(!sq||!bench||!dl)return null;
  const total=parseFloat(sq.w)+parseFloat(bench.w)+parseFloat(dl.w);
  const bw=S.bodyweight||185;const gn=S.aftGender||'male';
  const bwK=bw/2.205,totK=total/2.205;
  const aw=gn==='female'?[594.31747775582,-27.23842536447,0.82112226871,-0.00930733913,4.731582e-5,-9.054e-8]:[-216.0475144,16.2606339,-0.002388645,-0.00113732,7.01863e-6,-1.291e-8];
  const dw=aw[0]+aw[1]*bwK+aw[2]*bwK**2+aw[3]*bwK**3+aw[4]*bwK**4+aw[5]*bwK**5;
  const wilks=Math.round(500/dw*totK*10)/10;
  const ad=gn==='female'?-57.96288+13.6175032*bwK-0.1126655495*bwK**2+0.0005158568*bwK**3-1.0706e-6*bwK**4:-307.75076+24.0900756*bwK-0.1918759221*bwK**2+0.0007391293*bwK**3-1.093e-6*bwK**4;
  const dots=Math.round(500/ad*totK*10)/10;
  return{total,wilks,dots,sq:sq.w,bench:bench.w,dl:dl.w};
}
function getStdLevels(){
  const bw=S.bodyweight||185;const gn=S.aftGender||'male';
  return Object.entries(STR_STANDARDS).map(([id,std])=>{
    const pr=S.prs[id];if(!pr)return{id,name:std.name,level:0,current:0,targets:[]};
    const w=parseFloat(pr.w);
    const mults=(gn==='female'?std.f:std.m).map(m=>m*bw);
    let level=0;for(let i=0;i<mults.length;i++){if(w>=mults[i])level=i+1;}
    return{id,name:std.name,level,current:w,targets:mults};
  });
}
function aftScore(evId,val,ag,gn){
  const g=AFT_TABLES[gn]||AFT_TABLES.male;const agKey=g[ag]?ag:Object.keys(g)[0];
  const table=g[agKey]?.[evId];if(!table||val===''||val==null)return null;
  const v=parseFloat(val);if(isNaN(v))return null;
  const ev=AFT_EVENTS.find(e=>e.id===evId);const dir=ev?.dir||'high';
  const sorted=[...table].sort((a,b)=>dir==='high'?a[0]-b[0]:b[0]-a[0]);
  if(dir==='high'){if(v<=sorted[0][0])return Math.max(0,sorted[0][1]-5);if(v>=sorted[sorted.length-1][0])return 100;for(let i=1;i<sorted.length;i++){if(v<=sorted[i][0]){const p=(v-sorted[i-1][0])/(sorted[i][0]-sorted[i-1][0]);return Math.round(sorted[i-1][1]+p*(sorted[i][1]-sorted[i-1][1]));}}
  }else{if(v>=sorted[0][0])return Math.max(0,sorted[0][1]-5);if(v<=sorted[sorted.length-1][0])return 100;for(let i=1;i<sorted.length;i++){if(v>=sorted[i][0]){const p=(sorted[i-1][0]-v)/(sorted[i-1][0]-sorted[i][0]);return Math.round(sorted[i-1][1]+p*(sorted[i][1]-sorted[i-1][1]));}}
  }
  return 60;
}

// ─── UI helpers ───
function makeOv(id){
  const ov=document.createElement('div');ov.className='ov';if(id)ov.id=id;
  ov.addEventListener('click',e=>{if(e.target===ov)dismissOv(ov);});
  return ov;
}
function dismissOv(ov){
  const modal=ov.querySelector('.modal');
  if(modal){modal.style.transition='transform .22s cubic-bezier(.22,.61,.36,1)';modal.style.transform='translateY(100%)';}
  setTimeout(()=>ov.remove(),220);
}
function attachSwipeDown(ov){
  const handle=ov.querySelector('.mh');const modal=ov.querySelector('.modal');
  if(!handle||!modal)return;
  let startY=0,startT=0,dragging=false;
  handle.style.touchAction='none';
  handle.addEventListener('pointerdown',e=>{
    startY=e.clientY;startT=Date.now();dragging=true;
    modal.style.transition='none';
    try{handle.setPointerCapture(e.pointerId);}catch(ex){}
  });
  handle.addEventListener('pointermove',e=>{
    if(!dragging)return;const dy=e.clientY-startY;
    if(dy>0)modal.style.transform=`translateY(${dy}px)`;
  });
  handle.addEventListener('pointerup',e=>{
    if(!dragging)return;dragging=false;
    const dy=e.clientY-startY,dt=Date.now()-startT;
    if(dy>80||dy/dt>0.5)dismissOv(ov);
    else{modal.style.transition='transform .22s cubic-bezier(.22,.61,.36,1)';modal.style.transform='';}
  });
  handle.addEventListener('pointercancel',()=>{
    dragging=false;modal.style.transition='transform .22s cubic-bezier(.22,.61,.36,1)';modal.style.transform='';
  });
}
function toast(msg,color){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const el=document.createElement('div');el.className='toast';
  if(color==='gold')el.style.cssText='border-color:var(--gold);color:var(--gold)';
  if(color==='green')el.style.cssText='border-color:var(--green);color:var(--green)';
  el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2300);
}

          :`<button class="btn" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.2);width:100%;padding:11px;font-size:14px;border-radius:10px;backdrop-filter:blur(4px)" onclick="startWorkout('${r.id}')">▶  Start ${r.name}</button>`
        }
      </div>`;
    });
    html+=`</div>`;

    // Intelligence feed
    const exIds=todayR.exercises.map(e=>e.exId);
    const wins=getProgressWins(exIds);
    const stag=getStagnantExercises(exIds);
    const painWs=getPainWarnings().filter(p=>exIds.includes(p.exId));
    const prox=getPRProximity();
    const momentum=getVolumeMomentum();

      icon:'🏆',color:'var(--gold)',bg:'var(--gdim)',border:'rgba(184,124,42,.2)',

    if(momentum.length)momentum.forEach(m=>feed.push({

    if(stag.length)stag.forEach(s=>feed.push({
      icon:'📊',color:'var(--gold)',bg:'var(--gdim)',border:'rgba(184,124,42,.15)',
      title:`Stagnant: ${s.name}`,
      sub:`No e1RM progress in last 3 sessions. Try adding weight or reps today.`
    }));
    if(painWs.length)painWs.forEach(p=>feed.push({
      icon:'🩹',color:'var(--red)',bg:'var(--rdim)',border:'rgba(184,60,60,.2)',
      title:`Pain flagged — ${p.name}`,
      sub:`Reported in ${p.sessions} of last 3 sessions. Use lighter load, full range.`

    if(feed.length){
      html+=`<div style="padding:0 13px;margin-bottom:4px">`;
      feed.slice(0,3).forEach(f=>{
        html+=`<div style="background:${f.bg};border:1px solid ${f.border};border-radius:12px;padding:13px;margin-bottom:9px;display:flex;align-items:flex-start;gap:11px">

        </div>`;
      });
      html+=`</div>`;
    }
  }else{
    // No routine today — general intelligence
    const wins=getProgressWins();const prox=getPRProximity();const momentum=getVolumeMomentum();
    const streak=getStreak();
    html+=`<div style="padding:0 13px 4px">`;
    if(streak>0)html+=`<div style="background:var(--ndim);border:1px solid var(--nbright);border-radius:12px;padding:13px;margin-bottom:9px;display:flex;align-items:center;gap:12px"><div style="font-size:28px">🔥</div><div><div style="font-size:15px;font-weight:700;letter-spacing:-.02em">${streak}-day streak</div><div style="font-size:11px;color:var(--muted);margin-top:2px">Consistency compounds. Don't stop now.</div></div></div>`;
    if(wins.length)html+=`<div style="background:var(--grdim);border:1px solid rgba(45,122,82,.18);border-radius:12px;padding:13px;margin-bottom:9px"><div style="font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--green);margin-bottom:6px">Progress Win</div>${wins.map(w=>`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px"><div style="font-size:13px;font-weight:600">${w.name}</div><div style="font-size:13px;font-weight:700;color:var(--green)">+${w.pct}%</div></div>`).join('')}<div style="font-size:11px;color:var(--muted);margin-top:4px">e1RM improvement over last ${wins[0]?.sessions} sessions</div></div>`;
    if(prox.length)html+=`<div style="background:var(--gdim);border:1px solid rgba(184,124,42,.2);border-radius:12px;padding:13px;margin-bottom:9px;display:flex;align-items:flex-start;gap:11px"><div style="font-size:18px">🏆</div><div><div style="font-size:13px;font-weight:600;color:var(--gold)">${prox[0].gap}${S.unit} from your ${prox[0].name} PR</div><div style="font-size:11px;color:var(--muted);margin-top:3px">Target: ${prox[0].prEst}${S.unit}. You're right there.</div></div></div>`;
    if(momentum.length)html+=`<div style="background:var(--ndim);border:1px solid var(--nbright);border-radius:12px;padding:13px;margin-bottom:9px;display:flex;align-items:flex-start;gap:11px"><div style="font-size:18px">📈</div><div><div style="font-size:13px;font-weight:600;color:var(--navy)">${momentum[0].muscle} volume rising</div><div style="font-size:11px;color:var(--muted);margin-top:3px">Up ${momentum[0].weeks} consecutive weeks. Keep loading.</div></div></div>`;
    html+=`</div>`;
  }

  // Action buttons
  html+=`<div style="padding:4px 13px 10px;display:grid;grid-template-columns:1fr 1fr;gap:9px">
    <button class="btn btp bfw" style="padding:13px;border-radius:10px;font-size:14px" onclick="startWorkout()">+ Workout</button>
    <button class="btn bts bfw" style="padding:13px;border-radius:10px;font-size:14px" onclick="showLogActivity()">+ Activity</button>
  </div>`;

  // Other routines
  const otherRoutines=(S.routines||[]).filter(r=>r.active!==false&&!todayRoutines.find(x=>x.id===r.id));
  if(otherRoutines.length){
    html+=`<div class="sec-lbl">Other Routines</div><div class="card">`;
    otherRoutines.forEach(r=>{
      const last=S.workouts.find(w=>w.routineId===r.id);
      const names=r.exercises.slice(0,3).map(e=>getEx(e.exId)?.name||'').filter(Boolean);
      html+=`<div class="hi"><div style="flex:1">
        <div class="hn">${r.name}</div>
        <div class="hm">${r.exercises.length} exercises${last?` · ${fmtShort(new Date(last.started).toISOString())}`:' · Never done'}${names.length?` · ${names.join(', ')}`:''}</div>
      </div><button class="btn btp bsm" style="flex-shrink:0" onclick="startWorkout('${r.id}')">▶</button></div>`;
    });
    html+=`</div>`;
  }

  c.innerHTML=html;
}

function showLogActivity(ds){
  const ov=makeOv('act-ov');const def=ds||today();
  ov.innerHTML=`<div class="modal"><div class="mh"></div><div class="mt">Log Activity</div>
    <div class="fg"><label class="fl">Date</label><input type="date" id="act-date" value="${def}" max="${today()}"></div>
    <div class="fg"><label class="fl">Type</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">
        ${ACT_TYPES.map((t,i)=>`<button class="btn ${i===0?'btp':'bts'}" id="atype-${t.id}" onclick="selActType('${t.id}')" style="font-size:12px;gap:4px">${t.icon} ${t.label}</button>`).join('')}
      </div>
    </div>
    <div id="act-fields"></div>
    <div class="fg"><label class="fl">Notes</label><textarea id="act-notes" style="min-height:48px;font-size:13px" placeholder="How did it go?"></textarea></div>
    <div id="act-cal-prev" style="font-size:12px;color:var(--green);font-weight:500;margin-bottom:12px;font-family:'IBM Plex Mono',monospace"></div>

    <button class="btn btg bfw" style="margin-top:7px" onclick="dismissOv(document.getElementById('act-ov'))">Cancel</button>
  </div>`;
  document.body.appendChild(ov);attachSwipeDown(ov);window._actType='run';selActType('run');
}
function selActType(tid){
  window._actType=tid;
  document.querySelectorAll('[id^="atype-"]').forEach(b=>b.className=`btn ${b.id===`atype-${tid}`?'btp':'bts'}`);
  const t=ACT_TYPES.find(a=>a.id===tid);const el=document.getElementById('act-fields');if(!el||!t)return;
  let html='';
  if(t.fields.includes('dist'))html+=`<div class="fg"><label class="fl">Distance (miles)</label><input type="number" inputmode="decimal" id="act-dist" placeholder="0" oninput="updActCal()"></div>`;
  if(t.fields.includes('dur'))html+=`<div class="fg"><label class="fl">Duration (min)</label><input type="number" inputmode="numeric" id="act-dur" placeholder="0" oninput="updActCal()"></div>`;
  if(t.fields.includes('ruckWeight'))html+=`<div class="fg"><label class="fl">Ruck Weight (${S.unit})</label><input type="number" inputmode="decimal" id="act-rw" placeholder="0" oninput="updActCal()"></div>`;
  if(t.fields.includes('terrain'))html+=`<div class="fg"><label class="fl">Terrain</label><select id="act-terrain" onchange="updActCal()"><option value="flat">Flat</option><option value="hilly">Hilly (×1.3)</option><option value="trail">Trail (×1.2)</option><option value="mixed">Mixed (×1.15)</option></select></div>`;
  el.innerHTML=html;
}
function updActCal(){
  const act={type:window._actType,dist:document.getElementById('act-dist')?.value,dur:document.getElementById('act-dur')?.value,ruckWeight:document.getElementById('act-rw')?.value,terrain:document.getElementById('act-terrain')?.value};
  const cals=activityCals(act);const el=document.getElementById('act-cal-prev');
  if(el&&(act.dist||act.dur))el.textContent=`~${cals} kcal estimated`;
}
function saveActivity(){
  const date=document.getElementById('act-date')?.value||today();
  const t=ACT_TYPES.find(a=>a.id===window._actType);
  const act={id:uid(),type:window._actType,date,dist:document.getElementById('act-dist')?.value||'',dur:document.getElementById('act-dur')?.value||'',ruckWeight:document.getElementById('act-rw')?.value||'',terrain:document.getElementById('act-terrain')?.value||'flat',notes:document.getElementById('act-notes')?.value||''};
  act.cals=activityCals(act);
  if(!t?.fields.includes('dist')&&!act.dur){toast('Enter a duration');return;}
  S.activities.unshift(act);save();
  dismissOv(document.getElementById('act-ov'));toast('Activity logged!','green');render();
}

function getLastRSess(rid){return S.workouts.find(w=>w.routineId===rid);}
function getAutoFill(exId,rid){
  if(rid){const sess=getLastRSess(rid);if(sess){const ex=sess.exercises.find(e=>e.exId===exId);if(ex){const done=ex.sets.filter(s=>s.done);if(done.length)return done.map(s=>({w:s.w,r:s.r}));}}}
  const pr=S.prs[exId];if(pr)return[{w:pr.w,r:pr.r},{w:pr.w,r:pr.r},{w:pr.w,r:pr.r}];return null;
}
function getLastStr(exId,rid){
  if(!rid)return null;const sess=getLastRSess(rid);if(!sess)return null;
  const ex=sess.exercises.find(e=>e.exId===exId);if(!ex)return null;
  const done=ex.sets.filter(s=>s.done);if(!done.length)return null;
  const mw=Math.max(...done.map(s=>parseFloat(s.w||0)));const ms=done.find(s=>parseFloat(s.w)===mw);
  return`Last: ${ms?.w||'?'}${S.unit}×${ms?.r||'?'} · ${done.length} sets`;
}
function startWorkout(rid){
  S.activeWorkout={id:uid(),routineId:rid||null,
    name:rid?(S.routines.find(r=>r.id===rid)?.name||'Workout'):`Workout — ${new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}`,
    started:Date.now(),exercises:[],notes:'',_origExIds:null};
  if(rid){const r=S.routines.find(x=>x.id===rid);if(r){S.activeWorkout._origExIds=r.exercises.map(e=>e.exId);r.exercises.forEach(re=>{const fill=getAutoFill(re.exId,rid);const sets=fill?fill.map(f=>({w:f.w,r:f.r,done:false,tag:''})):Array.from({length:re.sets||3},()=>({w:re.w||'',r:re.r||'',done:false,tag:''}));S.activeWorkout.exercises.push({exId:re.exId,sets,_af:!!fill});});}}
  save();render();startWtTimer();
}

function upd(ei,si,f,v){if(!S.activeWorkout)return;S.activeWorkout.exercises[ei].sets[si][f]=v;save();}
function togSet(ei,si){
  if(!S.activeWorkout)return;
  const s=S.activeWorkout.exercises[ei].sets[si];
  const wi=document.querySelector(`#sr-${ei}-${si} input:nth-of-type(1)`);
  const ri=document.querySelector(`#sr-${ei}-${si} input:nth-of-type(2)`);
  if(wi)s.w=wi.value;if(ri)s.r=ri.value;
  s.done=!s.done;
  if(s.done){checkPR(S.activeWorkout.exercises[ei].exId,parseFloat(s.w||0),parseInt(s.r||0));startRest(S.restDur);}
  save();
  const row=document.getElementById(`sr-${ei}-${si}`);

    row.querySelector('.chk')?.classList.toggle('done',s.done);

    const est=s.done&&parseFloat(s.w)&&parseInt(s.r)?e1rm(parseFloat(s.w),parseInt(s.r)):null;

    const cell=row.querySelector('.e1rm-cell');
    if(cell)cell.innerHTML=est?`<div class="e1rm-badge${isPR?' pr':''}">${est}${isPR?' 🏆':''}</div>`:'';
  }

function setTag(ei,si,tag){if(!S.activeWorkout)return;const s=S.activeWorkout.exercises[ei].sets[si];s.tag=tag;s._showTag=false;save();renderSession(document.getElementById('content'));}
function checkPR(exId,w,r){if(!w||!r)return;const est=e1rm(w,r);const prev=S.prs[exId];if(!prev||est>e1rm(parseFloat(prev.w),parseInt(prev.r))){S.prs[exId]={w,r,est,date:today()};save();const ex=getEx(exId);toast(`🏆 PR — ${ex?.name||'Exercise'}: ${w}${S.unit}×${r}`,'gold');}}
function addSet(ei){if(!S.activeWorkout)return;const ex=S.activeWorkout.exercises[ei];const last=ex.sets[ex.sets.length-1];ex.sets.push({w:last?.w||'',r:last?.r||'',done:false,tag:''});save();renderSession(document.getElementById('content'));setTimeout(()=>{document.querySelectorAll(`#exb-${ei} .srow`).slice(-1)[0]?.scrollIntoView({behavior:'smooth',block:'nearest'});},60);}

function showPlateCalc(ei){
  const ex=S.activeWorkout?.exercises[ei];
  const lastW=ex?.sets.filter(s=>s.done).slice(-1)[0]?.w||ex?.sets[0]?.w||'';
  const ov=makeOv('plate-ov');
  ov.innerHTML=`<div class="modal"><div class="mh"></div>

    </div>
    <div class="fg"><label class="fl">Target Weight (${S.unit})</label><input type="number" inputmode="decimal" id="plt-tgt" value="${lastW}" placeholder="0" oninput="calcPltDisp()"></div>
    <div class="fg"><label class="fl">Bar Weight</label><select id="plt-bar" onchange="calcPltDisp()">
      <option value="${S.unit==='kg'?20:45}">${S.unit==='kg'?'20kg':'45 lbs'} Standard</option>
      <option value="${S.unit==='kg'?15:35}">${S.unit==='kg'?'15kg':'35 lbs'} Light</option>
      <option value="${S.unit==='kg'?10:25}">${S.unit==='kg'?'10kg':"25 lbs Women's"}</option>
    </select></div>
    <div id="plt-result"></div>
    <button class="btn btg bfw" style="margin-top:12px" onclick="dismissOv(document.getElementById('plate-ov'))">Close</button>
  </div>`;
  document.body.appendChild(ov);attachSwipeDown(ov);calcPltDisp();
}
function calcPltDisp(){
  const tgt=parseFloat(document.getElementById('plt-tgt')?.value);
  const bar=parseFloat(document.getElementById('plt-bar')?.value)||(S.unit==='kg'?20:45);
  const el=document.getElementById('plt-result');if(!el)return;
  if(!tgt){el.innerHTML='';return;}
  const side=(tgt-bar)/2;
  if(side<0){el.innerHTML=`<div style="color:var(--red);font-size:13px;text-align:center;padding:12px">Below bar weight (${bar}${S.unit})</div>`;return;}
  const sets=S.unit==='kg'?[25,20,15,10,5,2.5,1.25]:[45,35,25,10,5,2.5,1.25];
  let rem=side;const plates=[];
  for(const p of sets){const n=Math.floor(rem/p+0.001);if(n>0){plates.push({w:p,n});rem-=p*n;}}
  const all=plates.flatMap(p=>Array(p.n).fill(p.w));
  const cls=w=>w>=45?'p45':w>=35?'p35':w>=25?'p25':w>=10?'p10':w>=5?'p5':'p2';
  el.innerHTML=`<div style="text-align:center;font-size:10px;color:var(--muted);margin-bottom:8px;font-weight:600;letter-spacing:.06em;text-transform:uppercase">Each side · bar ${bar}${S.unit}</div>
    <div class="plate-visual">${all.length?all.map(w=>`<div class="plate ${cls(w)}">${w}</div>`).join(''):'<div style="color:var(--muted);font-size:12px">Just the bar</div>'}</div>
    ${rem>0.01?`<div style="text-align:center;font-size:11px;color:var(--gold);font-weight:600">~${rem.toFixed(2)}${S.unit} remainder</div>`:''}`;
}

function showFinish(){

    ${diff?`<div style="background:var(--bdim);border:1px solid rgba(42,111,196,.18);border-radius:10px;padding:11px 13px;margin-bottom:12px">

      ${diff.added.map(n=>`<div style="color:var(--green);font-size:12px;font-weight:500">+ ${n}</div>`).join('')}
      ${diff.changed.map(n=>`<div style="color:var(--gold);font-size:12px;font-weight:500">~ ${n}</div>`).join('')}
      <button class="btn btb bsm bfw" style="margin-top:8px" onclick="saveRoutineChanges('${wk.routineId}')">Save to Routine</button>
    </div>`:''}

function getPRsFromSess(wk){
  const names=[];wk.exercises.forEach(ex=>{ex.sets.filter(s=>s.done).forEach(s=>{const w=parseFloat(s.w||0),r=parseInt(s.r||0);if(w&&r){const prev=S.prs[ex.exId];if(!prev||e1rm(w,r)>=e1rm(parseFloat(prev.w),parseInt(prev.r))){const info=getEx(ex.exId);if(info&&!names.includes(info.name))names.push(info.name);}}});});return names;
}
function getRoutineDiff(wk){
  if(!wk.routineId||!wk._origExIds)return null;
  const orig=wk._origExIds;const now=wk.exercises.map(e=>e.exId);
  const added=now.filter(id=>!orig.includes(id)).map(id=>getEx(id)?.name||id);
  const changed=[];const ls=getLastRSess(wk.routineId);
  if(ls){wk.exercises.filter(ex=>orig.includes(ex.exId)).forEach(ex=>{const prev=ls.exercises.find(e=>e.exId===ex.exId);if(!prev)return;const cW=parseFloat(ex.sets.find(s=>s.done)?.w||0);const pW=parseFloat(prev.sets.find(s=>s.done)?.w||0);if(pW&&cW&&Math.abs(cW-pW)/pW>0.03)changed.push(`${getEx(ex.exId)?.name||ex.exId} (${pW}→${cW}${S.unit})`);});}
  if(!added.length&&!changed.length)return null;return{added,changed};
}
function saveRoutineChanges(rid){
  const wk=S.activeWorkout;const r=S.routines.find(x=>x.id===rid);if(!r||!wk)return;
  wk.exercises.forEach(ex=>{if(!r.exercises.find(e=>e.exId===ex.exId)){const bs=ex.sets.find(s=>s.done)||ex.sets[0];r.exercises.push({exId:ex.exId,sets:ex.sets.length,w:bs?.w||'',r:bs?.r||''});}
  const rEx=r.exercises.find(e=>e.exId===ex.exId);if(!rEx)return;const bd=ex.sets.filter(s=>s.done).sort((a,b)=>parseFloat(b.w||0)-parseFloat(a.w||0))[0];if(bd){rEx.w=bd.w;rEx.r=bd.r;}rEx.sets=ex.sets.length;});
  save();toast('Routine updated!','green');
}
function saveWorkout(){
  const n=document.getElementById('wkn');const nt=document.getElementById('wknt');
  if(n)S.activeWorkout.name=n.value||S.activeWorkout.name;if(nt)S.activeWorkout.notes=nt.value;
  S.activeWorkout.ended=Date.now();S.activeWorkout.cals=sessionCals(S.activeWorkout.ended-S.activeWorkout.started);
  S.workouts.unshift(S.activeWorkout);S.activeWorkout=null;
  if(wtInt)clearInterval(wtInt);skipRest();save();
  document.getElementById('fin-ov')?.remove();toast('Workout saved!','green');render();
}

function deleteActivity(id){customConfirm('Remove this activity?','Delete',()=>{S.activities=S.activities.filter(a=>a.id!==id);save();document.getElementById('ad-ov')?.remove();renderHistory(document.getElementById('content'));});}

// ─── Calendar ───
function renderCalendar(){
  const yr=S.calYear,mo=S.calMonth;
  const first=new Date(yr,mo,1).getDay();const days=new Date(yr,mo+1,0).getDate();
  const wkMap={};
  S.workouts.forEach(w=>{const ds=new Date(w.started).toISOString().split('T')[0];if(!wkMap[ds])wkMap[ds]={w:0,a:0};wkMap[ds].w++;});
  S.activities.forEach(a=>{if(!wkMap[a.date])wkMap[a.date]={w:0,a:0};wkMap[a.date].a++;});
  const td=today();const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  // Planned routine dots for future days
  const routineDays={};
  (S.routines||[]).forEach(r=>{(r.days||[]).forEach(d=>{if(!routineDays[d])routineDays[d]=[];routineDays[d].push(r.name);});});

  let html=`<div style="display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-bottom:1px solid var(--border)">
    <button class="btn btg bsm" onclick="adjCal(-1)">‹</button>
    <div style="font-size:15px;font-weight:600;letter-spacing:-.01em">${months[mo]} ${yr}</div>
    <button class="btn btg bsm" onclick="adjCal(1)">›</button>
  </div>
  <div class="cal-grid">
    ${['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>`<div class="cal-day-hdr">${d}</div>`).join('')}`;
  for(let i=0;i<first;i++)html+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=days;d++){
    const ds=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const data=wkMap[ds]||{w:0,a:0};const isToday=ds===td;const isRest=!isTrainingDay(ds);
    const dow=new Date(ds+'T12:00:00').getDay();const hasPlanned=routineDays[dow]?.length>0&&ds>=td&&!isRest;
    const ovRid=S.schedule.routineOverrides&&S.schedule.routineOverrides[ds];
    const hasRoutineOverride=ovRid&&ovRid!=='rest';
    const isRestOverride=ovRid==='rest';
    html+=`<div class="cal-cell${isToday?' today':''}${(isRest||isRestOverride)?' rest-day':''}" onclick="calDayTap('${ds}')">
      <div class="cal-date" style="font-size:${isToday?'11px':'12px'}">${d}</div>
      <div class="cal-dots">
        ${Array(data.w).fill(0).map(()=>`<div class="cal-dot" style="background:var(--navy)"></div>`).join('')}
        ${Array(data.a).fill(0).map(()=>`<div class="cal-dot" style="background:var(--gold)"></div>`).join('')}
        ${hasPlanned&&!data.w?`<div class="cal-dot" style="background:var(--border);border:1px solid var(--navy)"></div>`:''}
        ${hasRoutineOverride&&!data.w?`<div class="cal-dot" style="background:var(--blue);border:1px solid var(--blue)"></div>`:''}
        ${(isRest||isRestOverride)&&!data.w?`<div style="font-size:7px;color:var(--muted2)">–</div>`:''}
      </div>
    </div>`;
  }
  html+=`</div>
  <div style="padding:10px 13px;display:flex;gap:14px;font-size:10px;font-weight:600;color:var(--muted)">
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--navy);margin-right:4px"></span>Workout</span>
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:4px"></span>Activity</span>
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:transparent;border:1px solid var(--navy);margin-right:4px"></span>Planned</span>
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--border);margin-right:4px"></span>Rest</span>
  </div>`;
  return html;
}
function adjCal(d){S.calMonth+=d;if(S.calMonth>11){S.calMonth=0;S.calYear++;}if(S.calMonth<0){S.calMonth=11;S.calYear--;}renderHistory(document.getElementById('content'));}
function calDayTap(ds){
  const isRest=!isTrainingDay(ds);
  const ovRid=S.schedule.routineOverrides&&S.schedule.routineOverrides[ds];
  const ovLabel=ovRid==='rest'?'Rest (override)':ovRid?(S.routines||[]).find(r=>r.id===ovRid)?.name||'Custom':null;
  const ov=makeOv('cal-tap-ov');
  ov.innerHTML=`<div class="modal" style="max-height:380px"><div class="mh"></div>
    <div style="font-size:14px;font-weight:600;margin-bottom:5px">${fmtDate(ds+'T12:00:00')}</div>
    <div style="font-size:12px;color:${isRest?'var(--muted)':'var(--green)'};font-weight:600;margin-bottom:4px">${isRest?'Rest Day':'Training Day'}</div>
    ${ovLabel?`<div style="font-size:11px;color:var(--blue);font-weight:500;margin-bottom:12px">Override active: ${ovLabel}</div>`:'<div style="margin-bottom:12px"></div>'}
    <button class="btn bts bfw" style="margin-bottom:9px" onclick="dismissOv(document.getElementById('cal-tap-ov'));showRoutineOverridePicker('${ds}')">📅 Set Routine for This Day</button>
    <button class="btn bts bfw" style="margin-bottom:9px" onclick="dismissOv(document.getElementById('cal-tap-ov'));toggleDayOverride('${ds}')">${isRest?'Mark as Active':'Mark as Rest'}</button>
    ${ds<=today()?`<button class="btn btp bfw" style="margin-bottom:9px" onclick="dismissOv(document.getElementById('cal-tap-ov'));showLogActivity('${ds}')">+ Log Activity</button>`:''}
    <button class="btn btg bfw" onclick="dismissOv(document.getElementById('cal-tap-ov'))">Close</button>
  </div>`;
  document.body.appendChild(ov);attachSwipeDown(ov);
}
function showRoutineOverridePicker(ds){
  const ov=makeOv('rov-ov');
  const current=S.schedule.routineOverrides&&S.schedule.routineOverrides[ds];
  const activeRoutines=(S.routines||[]).filter(r=>r.active!==false);
  ov.innerHTML=`<div class="modal" style="max-height:75vh"><div class="mh"></div>
    <div class="mt">Routine for ${fmtShort(ds+'T12:00:00')}</div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:14px;line-height:1.5">Override the scheduled routine for this date only. Your regular schedule stays unchanged.</div>
    <button class="btn ${!current?'btp':'bts'} bfw" style="margin-bottom:8px" onclick="setRoutineOverride('${ds}',null)">Use Default Schedule</button>
    <button class="btn ${current==='rest'?'btd':'bts'} bfw" style="margin-bottom:8px" onclick="setRoutineOverride('${ds}','rest')">Rest Day</button>
    ${activeRoutines.map(r=>`<button class="btn ${current===r.id?'btp':'bts'} bfw" style="margin-bottom:8px" onclick="setRoutineOverride('${ds}','${r.id}')">${r.name}</button>`).join('')}
    <button class="btn btg bfw" style="margin-top:4px" onclick="dismissOv(document.getElementById('rov-ov'))">Cancel</button>
  </div>`;
  document.body.appendChild(ov);attachSwipeDown(ov);
}
function setRoutineOverride(ds,rid){
  if(!S.schedule.routineOverrides)S.schedule.routineOverrides={};
  if(rid===null)delete S.schedule.routineOverrides[ds];
  else S.schedule.routineOverrides[ds]=rid;
  save();
  document.getElementById('rov-ov')?.remove();
  renderHistory(document.getElementById('content'));
  if(ds===today())render();
  toast('Schedule updated','green');
}
function toggleDayOverride(ds){
  const isTrain=isTrainingDay(ds);
  S.schedule.overrides[ds]=isTrain?'rest':'active';
  save();renderHistory(document.getElementById('content'));
}

function renderProgress(c){
  const order=GOAL_ORDER[S.goal||'general']||GOAL_ORDER.general;
  const sorted=order.map(id=>DASH_CARDS.find(d=>d.id===id)).filter(Boolean);
  let html=`<div class="ph"><div class="page-title">Progress</div></div>`;
  sorted.forEach(card=>{
    const open=S.expandedCards[card.id];const sub=getDashSub(card.id);
    html+=`<div class="dash-card"><div class="dash-hdr" onclick="toggleCard('${card.id}')">
      <div class="dash-icon">${card.icon}</div>
      <div class="dash-info"><div class="dash-title">${card.title}</div>${sub?`<div class="dash-sub">${sub}</div>`:''}</div>
      <div class="dash-chev${open?' open':''}">›</div>
    </div>${open?`<div class="dash-body" id="card-${card.id}">${getDashBody(card.id)}</div>`:''}</div>`;
  });
  c.innerHTML=html;if(Object.values(S.expandedCards).some(Boolean))setTimeout(()=>renderCharts(),60);
}
function toggleCard(id){S.expandedCards[id]=!S.expandedCards[id];renderProgress(document.getElementById('content'));}
function getDashSub(id){
  if(id==='weekly'){const n=S.workouts.filter(w=>w.started>=Date.now()-7*86400000).length;return`${n} session${n!==1?'s':''} this week`;}
  if(id==='strength'){const n=getExsWithHist().length;return n?`${n} exercises tracked`:'No history yet';}
  if(id==='prs'){const n=Object.keys(S.prs).length;return n?`${n} PR${n!==1?'s':''} recorded`:'None yet';}
  if(id==='volume'){const n=S.workouts.filter(w=>w.started>=Date.now()-7*86400000).reduce((t,wk)=>t+doneSetCnt(wk),0);return`${n} sets this week`;}
  if(id==='bodyweight'){const bwl=S.bodyweightLog||[];return bwl.length?`${bwl[0].weight}${S.unit} current`:'No logs yet';}
  if(id==='measurements'){const m=S.measurements||[];return m.length?`Last: ${fmtShort(m[0].date+'T12:00:00')}`:'No measurements yet';}
  if(id==='standards'){const lvs=getStdLevels();const p=lvs.filter(l=>l.level>0).length;return p?`${p}/${lvs.length} graded`:'No lift data yet';}
  if(id==='aft'){const sc=AFT_EVENTS.map(e=>aftScore(e.id,S.aftCurrent[e.id],S.aftAge,S.aftGender)).filter(s=>s!==null);return sc.length?`Avg ${Math.round(sc.reduce((a,b)=>a+b,0)/sc.length)} pts`:'No scores entered';}
  if(id==='consistency')return`${getStreak()} day streak`;
  if(id==='recovery'){const{warnings}=getRecoveryData();return warnings.length?`⚠ ${warnings.length} muscle${warnings.length>1?'s':''} at risk`:'Fatigue normal';}
  if(id==='rucking'){const n=S.activities.filter(a=>['ruck','run','hike','bike','swim','walk'].includes(a.type)).length;return n?`${n} cardio sessions`:'None logged';}
  if(id==='wilks'){const w=getWilksData();return w?`Wilks ${w.wilks} · DOTS ${w.dots}`:'Need squat, bench, deadlift PRs';}
  return'';
}
function getDashBody(id){
  if(id==='weekly')return renderWeeklyBody();if(id==='strength')return renderStrengthBody();
  if(id==='prs')return renderPRsBody();if(id==='volume')return renderVolumeBody();
  if(id==='bodyweight')return renderBodyweightBody();if(id==='measurements')return renderMeasurementsBody();
  if(id==='standards')return renderStandardsBody();if(id==='aft')return renderAFTBody();
  if(id==='consistency')return renderConsistencyBody();if(id==='recovery')return renderRecoveryBody();
  if(id==='rucking')return renderRuckingBody();if(id==='wilks')return renderWilksBody();
  return'';
}
function renderCharts(){
  if(S.expandedCards.weekly)renderWeeklyChart();if(S.expandedCards.strength)renderStrengthChart();

  if(S.expandedCards.rucking)renderRuckingChart();
}

function renderWeeklyChart(){const data=getWeeklyActivity(10);mkChart('ch-weekly',{type:'bar',data:{labels:Array.from({length:10},(_,i)=>`W-${9-i}`),datasets:[{data,backgroundColor:cv('--ndim'),borderColor:cv('--navy'),borderWidth:1.5,borderRadius:4}]},options:{...baseOpts(),plugins:{legend:{display:false}}}});}

function renderStrengthChart(){const exId=S.progExId||getExsWithHist()[0];if(!exId)return;const data=getExStrData(exId);if(!data.length)return;mkChart('ch-str',{type:'line',data:{labels:data.map(d=>d.label),datasets:[{data:data.map(d=>d.e1rm),borderColor:cv('--navy'),backgroundColor:'transparent',tension:0.3,pointRadius:4,pointBackgroundColor:cv('--navy')}]},options:{...baseOpts(),plugins:{legend:{display:false}},scales:{x:{ticks:{color:cv('--muted'),font:{size:9}},grid:{display:false}},y:{ticks:{color:cv('--muted'),font:{size:10}},grid:{color:cv('--border')}}}}});}
function renderPRsBody(){const prs=Object.entries(S.prs).sort((a,b)=>parseFloat(b[1].w)-parseFloat(a[1].w));if(!prs.length)return`<div class="empty" style="padding:24px"><div style="font-size:28px;margin-bottom:8px">🏆</div><div class="etit" style="font-size:14px">No PRs yet</div></div>`;return`<div>${prs.map(([id,pr])=>{const ex=getEx(id);return`<div class="mvrow"><div class="mvname">${ex?.name||id}</div><div class="mono" style="font-size:13px;font-weight:600;color:var(--gold)">${pr.w}<span style="font-size:10px;opacity:.6"> ${S.unit}</span></div><div style="font-size:10px;color:var(--muted);margin-left:9px">×${pr.r}</div></div>`;}).join('')}</div>`;}
function renderVolumeBody(){
  const ago7=Date.now()-7*86400000;const sbm={};
  S.workouts.filter(w=>w.started>=ago7).forEach(wk=>wk.exercises.forEach(ex=>{const info=getEx(ex.exId);if(!info?.muscle)return;sbm[info.muscle]=(sbm[info.muscle]||0)+ex.sets.filter(s=>s.done).length;}));
  const muscles=Object.entries(MEV_MAV);
  let html=`<div style="padding:8px 13px 5px;font-size:10px;color:var(--muted2);font-weight:500;letter-spacing:.04em;text-transform:uppercase">This week · target: MEV–MAV sets</div>`;
  html+=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--border)">`;
  muscles.forEach(([m,mm])=>{
    const s=sbm[m]||0;
    const status=s===0?'none':s<mm.mev?'low':s<=mm.mav?'ok':'high';
    const bg={'none':'var(--card)','low':'var(--rdim)','ok':'var(--grdim)','high':'var(--pdim)'}[status];
    const col={'none':'var(--muted2)','low':'var(--red)','ok':'var(--green)','high':'var(--purple)'}[status];
    const lbl={'none':'–','low':'Below','ok':'On Track','high':'Above Max'}[status];
    const pct=Math.min(100,Math.round((s/mm.mav)*100));
    html+=`<div style="background:${bg};padding:10px 8px;text-align:center">
      <div style="font-size:8px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:3px">${mm.lbl}</div>
      <div style="font-size:22px;font-weight:600;font-family:'IBM Plex Mono',monospace;color:${col};line-height:1.1">${s}</div>
      <div style="font-size:8px;color:${col};margin-top:2px;font-weight:600">${lbl}</div>
      <div style="height:3px;background:var(--border);border-radius:2px;margin-top:5px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${col};border-radius:2px"></div></div>
    </div>`;
  });
  html+=`</div><div style="padding:8px 13px;display:flex;gap:12px;font-size:10px;font-weight:600;border-top:1px solid var(--border)">
    <span style="color:var(--red)">■ Below MEV</span><span style="color:var(--green)">■ In Range</span><span style="color:var(--purple)">■ Above MAV</span>
  </div>`;

}
function renderRecoveryBody(){

    <div style="display:grid;grid-template-columns:1fr 52px 52px 58px;padding:8px 0;border-bottom:2px solid var(--border)">

      <div style="font-size:9px;font-weight:700;color:var(--muted2);text-align:center;text-transform:uppercase;letter-spacing:.06em">W–1</div>

    </div>`;
  Object.entries(MEV_MAV).forEach(([m,mm])=>{
    const w2=ws[2]?.[m]||0,w1=ws[1]?.[m]||0,w0=ws[0]?.[m]||0;

      <div style="text-align:center;font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace">${w1||'–'}</div>
      <div style="text-align:center;display:flex;align-items:center;justify-content:center;gap:3px">
        <span style="font-size:13px;font-weight:700;color:${col};font-family:'IBM Plex Mono',monospace">${w0||'–'}</span>

      </div>
    </div>`;
  });
  html+=`</div><div style="padding:9px 13px;font-size:10px;color:var(--muted2)">MAV exceeded 2+ weeks = accumulated fatigue. Consider a deload.</div>`;

function getMacroStreak(){
  let n=0;const dt=new Date();dt.setDate(dt.getDate()-1);
  while(n<365){
    const ds=dt.toISOString().split('T')[0];
    const todayMeals=(S.meals||[]).filter(m=>m.date===ds);
    const ml=S.macroLogs[ds];
    const hasMeals=todayMeals.some(m=>m.protein||m.carbs||m.fat||m.cals);
    const hasLog=ml&&(ml.protein||ml.carbs||ml.fat||ml.cals);
    if(!hasMeals&&!hasLog)break;
    n++;dt.setDate(dt.getDate()-1);
  }
  return n;
}
function getDayTotals(ds){
  const meals=(S.meals||[]).filter(m=>m.date===ds);
  const ml=S.macroLogs[ds]||{};
  if(meals.length){
    return{
      protein:meals.reduce((t,m)=>t+(parseFloat(m.protein)||0),0),
      carbs:meals.reduce((t,m)=>t+(parseFloat(m.carbs)||0),0),
      fat:meals.reduce((t,m)=>t+(parseFloat(m.fat)||0),0),
      cals:meals.reduce((t,m)=>t+(parseFloat(m.cals)||0),0),
      fromMeals:true
    };
  }
  return{...ml,fromMeals:false};
}
