  if(!window._rDraft)return;const days=window._rDraft.days;const idx=days.indexOf(i);
  if(idx>=0)days.splice(idx,1);else days.push(i);
  document.querySelectorAll(`[id^="rd-"]`).forEach(b=>{const di=parseInt(b.id.split('-')[1]);if(!isNaN(di))b.classList.toggle('on',days.includes(di));});
}
function addExToRoutine(rid,exId){
  if(!window._rDraft||window._rDraft.id!==rid)window._rDraft={id:rid,exercises:[],days:[]};
  window._rDraft.exercises.push({exId,sets:3,w:'',r:''});
  const cnt=document.getElementById('r-exs-count');if(cnt)cnt.textContent=window._rDraft.exercises.length;
  const cont=document.getElementById(`r-exs-${rid}`);if(cont){cont.innerHTML=window._rDraft.exercises.map((e,j)=>{const ex=getEx(e.exId);return`<div style="display:flex;align-items:center;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:9px;margin-bottom:5px"><div style="flex:1;font-size:13px;font-weight:500">${ex?.name||e.exId}</div><button class="ib delbtn" onclick="rmFromDraft(${j})">✕</button></div>`;}).join('');}
}
function rmFromDraft(i){if(!window._rDraft)return;window._rDraft.exercises.splice(i,1);const cont=document.getElementById(`r-exs-${window._rDraft.id}`);if(cont)cont.innerHTML=window._rDraft.exercises.map((e,j)=>{const ex=getEx(e.exId);return`<div style="display:flex;align-items:center;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:9px;margin-bottom:5px"><div style="flex:1;font-size:13px;font-weight:500">${ex?.name||e.exId}</div><button class="ib delbtn" onclick="rmFromDraft(${j})">✕</button></div>`;}).join('');}
function saveRoutine(id){
  const name=document.getElementById('rn-name')?.value?.trim();if(!name){toast('Enter a name');return;}
  const notes=document.getElementById('rn-notes')?.value||'';
  const draft=window._rDraft;
  if(!S.routines)S.routines=[];
  // Check if existing routine (update) or new
  const existing=S.routines.find(r=>r.id===id);
  if(existing){existing.name=name;existing.notes=notes;if(draft)existing.exercises=draft.exercises;if(draft)existing.days=draft.days||[];}
  else{S.routines.push({id:id||uid(),name,notes,exercises:draft?.exercises||[],days:draft?.days||[]});}
  save();dismissOv(document.getElementById('cr-ov')||document.querySelector('.ov'));toast('Routine saved!','green');renderLibrary(document.getElementById('content'));
}
function showRoutineDetail(rid){
  const r=S.routines.find(x=>x.id===rid);if(!r)return;
  const last=getLastRSess(rid);const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const ov=makeOv('rd-ov');
  let exHtml='';
  r.exercises.forEach((re,i)=>{
    const ex=getEx(re.exId);const lastW=last?last.exercises.find(e=>e.exId===re.exId)?.sets.filter(s=>s.done).slice(-1)[0]?.w:null;
    exHtml+=`<div class="exi"><div style="flex:1"><div class="exin">${ex?.name||re.exId}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:1px">${re.sets||3} sets${re.w?` · ${re.w}${S.unit}`:''}${lastW?` · <span style="color:var(--green);font-weight:600">Last: ${lastW}${S.unit}</span>`:''}</div>
    </div><button class="ib delbtn" onclick="rmFromRoutine('${rid}',${i})">✕</button></div>`;
  });
  ov.innerHTML=`<div class="modal"><div class="mh"></div>
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px">
      <div><div class="mt" style="margin-bottom:4px">${r.name}</div>
        ${(r.days||[]).length?`<div style="font-size:11px;color:var(--navy);font-weight:600">${r.days.map(d=>DOW[d]).join(', ')}</div>`:''}
        ${r.notes?`<div style="font-size:12px;color:var(--muted);margin-top:4px">${r.notes}</div>`:''}
      </div>
      <button class="btn btp bsm" onclick="startWorkout('${rid}');dismissOv(document.getElementById('rd-ov'))">▶ Start</button>
    </div>
    ${last?`<div style="background:var(--grdim);border:1px solid rgba(45,122,82,.15);border-radius:9px;padding:8px 12px;margin-bottom:12px;font-size:11px;color:var(--green);font-weight:600">Last session: ${fmtDate(new Date(last.started).toISOString())} · ${doneSetCnt(last)} sets</div>`:''}
    <div class="fg"><label class="fl">Schedule Days</label>
      <div style="display:flex;gap:5px;justify-content:space-between;margin-top:4px">
        ${DOW.map((d,i)=>`<button class="sched-day${(r.days||[]).includes(i)?' on':''}" id="rdx-${rid}-${i}" onclick="togRoutineDay('${rid}',${i})">${d.slice(0,2)}</button>`).join('')}
      </div>
    </div>
    <div style="border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:12px">${exHtml||'<div class="empty" style="padding:20px"><div class="etit" style="font-size:13px">No exercises</div></div>'}</div>
    <button class="btn bts bfw" style="margin-bottom:9px" onclick="showExPicker('${rid}')">+ Add Exercise</button>
    <button class="btn ${r.active===false?'btok':'bts'} bfw" style="margin-bottom:9px" onclick="toggleRoutineActive('${rid}')">${r.active===false?'Activate Routine':'Deactivate Routine'}</button>
    <button class="btn btd bfw" onclick="delRoutine('${rid}')">Delete Routine</button>
    <button class="btn btg bfw" style="margin-top:7px" onclick="dismissOv(document.getElementById('rd-ov'))">Close</button>
  </div>`;
  document.body.appendChild(ov);attachSwipeDown(ov);window._pickRid=null;
}
function togRoutineDay(rid,i){
  const r=S.routines.find(x=>x.id===rid);if(!r)return;
  if(!r.days)r.days=[];const idx=r.days.indexOf(i);
  if(idx>=0)r.days.splice(idx,1);else r.days.push(i);
  save();document.querySelectorAll(`[id^="rdx-${rid}-"]`).forEach(b=>{const di=parseInt(b.id.split('-').pop());if(!isNaN(di))b.classList.toggle('on',r.days.includes(di));});
  toast('Schedule updated','green');
}
function rmFromRoutine(rid,i){const r=S.routines.find(x=>x.id===rid);if(!r)return;r.exercises.splice(i,1);save();document.getElementById('rd-ov')?.remove();showRoutineDetail(rid);}
function toggleRoutineActive(rid){
  const r=S.routines.find(x=>x.id===rid);if(!r)return;
  r.active=r.active===false?true:false;
  save();document.getElementById('rd-ov')?.remove();showRoutineDetail(rid);
  toast(r.active===false?'Routine deactivated':'Routine activated','green');
}
function delRoutine(rid){customConfirm('Delete this routine?','Delete',()=>{S.routines=S.routines.filter(r=>r.id!==rid);save();document.querySelector('#rd-ov')?.remove();renderLibrary(document.getElementById('content'));});}
// ═══════════════════════════════════════════════════
// SETTINGS
// ═══════════════════════════════════════════════════
function showSettings(){
  const ov=makeOv('set-ov');const sch=S.schedule||{type:'weekly',weeklyDays:[1,2,4,5],cycleOn:2,cycleOff:1};
  const DOW=['Su','Mo','Tu','We','Th','Fr','Sa'];
  ov.innerHTML=`<div class="modal" style="max-height:95vh"><div class="mh"></div><div class="mt">Settings</div>
    <div class="fg"><label class="fl">Name</label><input id="set-name" value="${S.name||''}"></div>
    <div class="fg"><label class="fl">Bodyweight (${S.unit})</label><input type="number" inputmode="decimal" id="set-bw" value="${S.bodyweight||''}"></div>
    <div class="fg"><label class="fl">Goal</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px" id="set-goals">
        ${GOALS.map(g=>`<button class="btn ${S.goal===g.id?'btp':'bts'}" id="sg-${g.id}" onclick="setGoal('${g.id}')" style="font-size:11px;text-align:left;justify-content:flex-start;gap:6px;padding:9px 10px">${g.icon} ${g.label}</button>`).join('')}
      </div>
    </div>
    <div class="fg"><label class="fl">Weight Unit</label>
      <div class="frow">
        <button id="set-lbs" class="btn ${S.unit==='lbs'?'btp':'bts'} bfw" onclick="setUnit('lbs')">lbs</button>
        <button id="set-kg" class="btn ${S.unit==='kg'?'btp':'bts'} bfw" onclick="setUnit('kg')">kg</button>
      </div>
    </div>
    <div class="fg"><label class="fl">Rest Timer</label>
      <div class="frow">${[60,90,120,150,180].map(v=>`<button class="btn ${(S.restDur||90)===v?'btp':'bts'} bfw" style="flex:1;padding:8px 0;font-size:12px" onclick="setRest(${v})">${v}s</button>`).join('')}</div>
    </div>

    <div style="border-top:1px solid var(--border);padding-top:14px;margin-bottom:12px">
      <label class="fl" style="margin-bottom:10px">Training Schedule</label>
      <div class="frow" style="margin-bottom:12px">
        <button class="btn ${sch.type==='weekly'?'btp':'bts'} bfw" onclick="setSchedType('weekly')">Custom Days</button>
        <button class="btn ${sch.type==='cycle'?'btp':'bts'} bfw" onclick="setSchedType('cycle')">Rotation</button>
      </div>
      <div id="sched-body">${renderSchedBody(sch)}</div>
    </div>

    ${S.routines?.length?`<div style="border-top:1px solid var(--border);padding-top:14px;margin-bottom:12px">
      <label class="fl" style="margin-bottom:10px">Routine Days</label>
      <div style="font-size:11px;color:var(--muted);margin-bottom:10px">Assign each routine to specific days of the week. Lah We shows today's routine at the top of the home screen.</div>
      ${S.routines.map(r=>{const days=(r.days||[]);return`<div style="background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:8px">
        <div style="font-size:13px;font-weight:600;margin-bottom:8px">${r.name}</div>
        <div style="display:flex;gap:5px">
          ${DOW.map((d,i)=>`<button class="sched-day${days.includes(i)?' on':''}" id="rs-${r.id}-${i}" onclick="togRoutineDay('${r.id}',${i})">${d}</button>`).join('')}
        </div>
      </div>`;}).join('')}
    </div>`:''}

    <div style="border-top:1px solid var(--border);padding-top:14px;margin-top:2px">
      <label class="fl">App</label>
      <div class="frow" style="margin-bottom:10px">
        <span style="font-size:13px;font-weight:500;flex:1">Dark Mode</span>
        <button class="tog${S.darkMode?' on':''}" id="dm-tog" onclick="toggleDark()"></button>
      </div>
    </div>
    <div style="border-top:1px solid var(--border);padding-top:14px;margin-bottom:12px">
      <label class="fl" style="margin-bottom:10px">Data</label>
      <div class="frow">
        <button class="btn bts bfw" onclick="exportData()">⬇ Export</button>
        <button class="btn bts bfw" onclick="importData()">⬆ Import</button>
      </div>
      <div style="font-size:10px;color:var(--muted);margin-top:6px;line-height:1.5">Export saves all your data as a JSON file. Import loads a backup — your current data will be replaced.</div>
    </div>
    <button class="btn btp bfw" onclick="saveSettings()">Save</button>
    <button class="btn btd bfw" style="margin-top:10px" onclick="confirmReset()">Reset All Data</button>
    <button class="btn btg bfw" style="margin-top:7px" onclick="dismissOv(document.getElementById('set-ov'))">Cancel</button>
  </div>`;
  document.body.appendChild(ov);attachSwipeDown(ov);
}
function renderSchedBody(sch){
  const DOW=['Su','Mo','Tu','We','Th','Fr','Sa'];
  if((sch.type||'weekly')==='weekly'){
    const days=sch.weeklyDays||[1,2,4,5];
    return`<div style="display:flex;gap:5px;justify-content:space-between">${DOW.map((d,i)=>`<button class="sched-day${days.includes(i)?' on':''}" id="sday-${i}" onclick="toggleSchedDay(${i})">${d}</button>`).join('')}</div>`;
  }
  return`<div class="frow" style="flex-wrap:wrap;gap:10px">
    <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:130px"><label class="fl" style="margin:0;white-space:nowrap">Days On</label><input type="number" id="cyc-on" value="${sch.cycleOn||2}" style="width:60px;text-align:center;font-size:16px"></div>
    <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:130px"><label class="fl" style="margin:0;white-space:nowrap">Days Off</label><input type="number" id="cyc-off" value="${sch.cycleOff||1}" style="width:60px;text-align:center;font-size:16px"></div>
  </div><div class="fg" style="margin-top:10px"><label class="fl">Start Date</label><input type="date" id="cyc-start" value="${sch.cycleStart||today()}"></div>`;
}
function setSchedType(type){
  S.schedule.type=type;save();
  const el=document.getElementById('sched-body');if(el)el.innerHTML=renderSchedBody(S.schedule);
  ['weekly','cycle'].forEach(t=>{
    const btn=document.querySelector(`[onclick="setSchedType('${t}')"]`);
    if(btn)btn.className=`btn ${t===type?'btp':'bts'} bfw`;
  });
}
function toggleSchedDay(i){
  const days=S.schedule.weeklyDays||[1,2,4,5];const idx=days.indexOf(i);
  if(idx>=0)days.splice(idx,1);else days.push(i);
  S.schedule.weeklyDays=days;save();
  document.getElementById(`sday-${i}`)?.classList.toggle('on',days.includes(i));
}
function setGoal(id){S.goal=id;document.querySelectorAll('[id^="sg-"]').forEach(b=>{b.className=`btn ${b.id===`sg-${id}`?'btp':'bts'}`;b.style.cssText='font-size:11px;text-align:left;justify-content:flex-start;gap:6px;padding:9px 10px';});save();}
function setUnit(u){S.unit=u;['lbs','kg'].forEach(x=>{const el=document.getElementById(`set-${x}`);if(el)el.className=`btn ${x===u?'btp':'bts'} bfw`;});save();}
function setRest(v){
  S.restDur=v;save();
  [60,90,120,150,180].forEach(x=>{
    const el=document.querySelector(`[onclick="setRest(${x})"]`);
    if(el){el.className=`btn ${x===v?'btp':'bts'} bfw`;el.style.cssText='flex:1;padding:8px 0;font-size:12px';}
  });
}
function saveSettings(){
  const n=document.getElementById('set-name')?.value?.trim();if(n)S.name=n;
  const bw=parseFloat(document.getElementById('set-bw')?.value);
  if(bw&&!isNaN(bw)){S.bodyweight=bw;S.bodyweightLog=[{date:today(),weight:bw},...(S.bodyweightLog||[])];}
  if(S.schedule.type==='cycle'){
    const on=parseInt(document.getElementById('cyc-on')?.value);const off=parseInt(document.getElementById('cyc-off')?.value);const start=document.getElementById('cyc-start')?.value;
    if(on&&off){S.schedule.cycleOn=on;S.schedule.cycleOff=off;}if(start)S.schedule.cycleStart=start;
  }
  save();dismissOv(document.getElementById('set-ov'));toast('Saved!','green');render();
}
function confirmReset(){customConfirm('All workouts, PRs, and settings will be permanently deleted.','Reset everything',()=>{initState();save();document.getElementById('set-ov')?.remove();render();});}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=`lahwe-backup-${today()}.json`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  toast('Data exported!','green');
}
function importData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(typeof data!=='object'||(!data.workouts&&!data.routines))throw new Error('Invalid');
        S=data;
        if(!S.schedule)S.schedule={type:'weekly',weeklyDays:[1,2,4,5],cycleOn:2,cycleOff:1,cycleStart:today(),overrides:{},routineOverrides:{}};
        if(!S.schedule.routineOverrides)S.schedule.routineOverrides={};
        if(!S.meals)S.meals=[];
        save();applyDark();
        document.getElementById('set-ov')?.remove();
        render();toast('Data imported!','green');
      }catch(err){toast('Invalid backup file');}
    };
    reader.readAsText(file);
  };
  inp.click();
}

// ═══════════════════════════════════════════════════
// PWA + INIT
// ═══════════════════════════════════════════════════
window.addEventListener('load',()=>{
  initState();load();
  // Ensure nav is visible if onboarded
  if(S.onboarded){document.getElementById('nav').style.display='flex';}else{document.getElementById('nav').style.display='none';}
  go(S.tab||'workout');
});
window.addEventListener('resize',()=>{
  if(S.tab==='progress'&&Object.values(S.expandedCards).some(Boolean)){setTimeout(()=>renderCharts(),100);}
});
</script>
</body>
</html>
